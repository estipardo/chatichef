<!DOCTYPE html>
<html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tablero ChatiChef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: una columna de móvil (máx. 680px) con barra de pestañas fija abajo; tarjetas plegables por plato. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E8ECE7; --line:#D3DAD3;
  --fg:#18201C; --muted:#5C6A62;
  --accent:#1F6B4A; --accent-ink:#FFFFFF; --accent-soft:#DCEDE3;
  --warn:#9A5B05; --warn-soft:#FBEBCF;
  --bad:#A8322A; --bad-soft:#F8DEDA;
  --star:#C98A0B;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1A211D; --sunk:#232C27; --line:#2F3A34;
  --fg:#E7EEE9; --muted:#9AAAA1;
  --accent:#5FC193; --accent-ink:#0D1A13; --accent-soft:#1F3A2C;
  --warn:#F0B451; --warn-soft:#3A2C12;
  --bad:#F08A80; --bad-soft:#3C1E1B;
  --star:#F0B451; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A211D; --sunk:#232C27; --line:#2F3A34;
  --fg:#E7EEE9; --muted:#9AAAA1;
  --accent:#5FC193; --accent-ink:#0D1A13; --accent-soft:#1F3A2C;
  --warn:#F0B451; --warn-soft:#3A2C12;
  --bad:#F08A80; --bad-soft:#3C1E1B;
  --star:#F0B451; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--f-display);font-size:1.6rem;margin:0;letter-spacing:-.01em}
header.top .wk{color:var(--muted);font-size:.9rem}
.upd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);margin-top:4px}
.upd:empty{display:none}
.upd b{font-weight:600;color:var(--fg)}
.upd .stale{color:var(--warn);font-weight:600}
h2{font-family:var(--f-display);font-size:1.2rem;margin:0;text-wrap:balance}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.section{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;min-height:40px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:40px}
textarea{width:100%;min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.notice{border-radius:var(--r);padding:12px 14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.notice.warn{background:var(--warn-soft);border-color:transparent}
.notice.bad{background:var(--bad-soft);border-color:transparent}
.notice ul{margin:0;padding-left:18px}
.empty{padding:22px 16px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

/* Platos */
details.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.meal.done{background:var(--sunk)}
details.meal>summary{list-style:none;padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
details.meal>summary::-webkit-details-marker{display:none}
.slotline{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.mtitle{font-family:var(--f-display);font-weight:600;font-size:1.08rem;line-height:1.25;text-wrap:balance}
details.meal.done .mtitle{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.mbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:12px}
.origin{font-style:italic;color:var(--muted)}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.times div{background:var(--sunk);border-radius:8px;padding:6px 8px}
.times b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.times span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
ul.ings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ul.ings label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
ul.ings input[type=checkbox]{width:20px;height:20px;min-height:0;margin-top:2px;accent-color:var(--accent);flex:none}
ul.ings input:checked + span{color:var(--muted);text-decoration:line-through}
.from{font-size:.72rem;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px;margin-left:4px;white-space:nowrap}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.notes{display:flex;flex-direction:column;gap:8px}
.notes p{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.usedrow{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center}
.usedrow input{width:100%}
.stars{display:flex;gap:2px}
.stars button{border:none;background:none;font-size:1.6rem;line-height:1;color:var(--line);padding:4px;min-height:0}
.stars button.on{color:var(--star)}
.daygroup{display:flex;flex-direction:column;gap:8px}
.dayhead{display:flex;align-items:baseline;gap:8px}
.dayhead.today h2{color:var(--accent)}
.wswitch{display:flex;gap:6px;flex-wrap:wrap}
.wswitch button{flex:1;min-width:0;font-weight:600}
.wswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* Resumen: toda la semana en una pantalla de móvil, sin desplazarse */
body.fit .wrap{height:100vh;height:100dvh;padding-block:10px calc(66px + env(safe-area-inset-bottom,0px));gap:6px;overflow:hidden}
body.fit .upd{display:none}
body.fit header.top h1{font-size:1.3rem}
body.fit main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
body.fit main>.section{flex:1 1 auto;min-height:0}
.rs{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.45em;font-size:clamp(10.5px,min(3.3vw,1.85vh),15px);line-height:1.18}
.rs .wswitch button{min-height:0;padding:.35em .5em;font-size:.95em}
.rs-list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
button.rs-row{flex:1 1 0;min-height:0;width:100%;display:grid;grid-template-columns:3.1em minmax(0,1fr) 3.4em 3.9em;gap:.5em;align-items:center;text-align:left;font:inherit;color:inherit;background:transparent;border:0;border-radius:0;border-left:4px solid var(--pc,var(--line));border-top:1px solid var(--line);padding:.15em .6em;cursor:pointer}
button.rs-row:first-child{border-top:0}
button.rs-row.same{border-top-style:dashed}
.rs-row.same .rs-day b{visibility:hidden}
.rs-row.today{background:var(--accent-soft)}
.rs-row.done .rs-dish{text-decoration:line-through;color:var(--muted)}
.rs-day{display:flex;flex-direction:column;line-height:1.1}
.rs-day b{font-family:var(--f-display);font-size:1.15em}
.rs-day span,.rs-n span,.rs-dish small{font-size:.8em;color:var(--muted);font-weight:400}
.rs-dish{font-weight:700;min-width:0}
.rs-dish small{display:block}
.rs-n{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.rs-n span{display:block}
.rs-tag{font-size:.75em;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:0 .45em;margin-left:.25em;white-space:nowrap}
.p-carne{--pc:#C2603A}.p-pescado{--pc:#3A82B5}.p-huevo{--pc:#D29A1F}.p-legumbre{--pc:#7D8C30}
.rs-postres{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:.45em}
button.rs-postre{min-height:0;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.4em .6em;display:flex;flex-direction:column;gap:.1em;cursor:pointer}
.rs-postre .cap{font-size:.72em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rs-postre .sub{font-size:.85em;color:var(--muted);font-variant-numeric:tabular-nums}
.rs-foot{flex:none;display:flex;flex-direction:column;gap:.25em;font-size:.8em;color:var(--muted)}
.rs-legend{display:flex;flex-wrap:wrap;gap:.2em .8em}
.rs-legend i{display:inline-block;width:.75em;height:.75em;border-radius:2px;background:var(--pc);margin-right:.3em;vertical-align:-.05em}

/* Despensa */
.invgroup{display:flex;flex-direction:column;gap:6px}
.places{display:flex;flex-direction:column;gap:12px}
details.place{border-radius:var(--r);background:var(--sunk);border:1px solid var(--line)}
details.place>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:14px 14px}
details.place>summary::-webkit-details-marker{display:none}
.pname{font-family:var(--f-display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;min-width:0}
.pname::before{content:"";width:9px;height:9px;flex:none;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.place[open]>summary .pname::before{transform:rotate(45deg)}
details.place[open]>summary{border-bottom:1px solid var(--line)}
.pcount{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.psub{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.psub:empty{display:none}
.pbody{padding:12px;display:flex;flex-direction:column;gap:6px}
.pbody .empty{padding:14px 12px}
details.place.gone{background:transparent;border-style:dashed}
details.place.gone .pname{font-size:1rem;color:var(--muted)}
button.clr{align-self:flex-start;min-height:32px;padding:2px 8px;font-size:.82rem;color:var(--muted);border-color:transparent;text-decoration:underline;text-underline-offset:2px}
details.inv{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.inv>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;cursor:pointer;align-items:center}
details.inv>summary::-webkit-details-marker{display:none}
.iname{font-weight:700;min-width:0}
.iqty{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.iqty.unknown{color:var(--warn)}
.isub{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.iedit{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 input,.grid2 select{width:100%}
.moves{font-size:.82rem;color:var(--muted);margin:0;padding-left:18px}

/* Compra */
.shopsec{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.counter{font-family:var(--f-display);font-size:1.05rem}

/* Pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;width:100%;max-width:680px}
nav.tabs button{border:none;background:none;border-radius:8px;font-size:.76rem;padding:8px 2px;color:var(--muted);min-height:44px}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:.7rem;margin-left:3px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center;z-index:9;max-width:calc(100% - 32px)}
.toast button{background:transparent;color:var(--bg);border-color:var(--bg);min-height:34px;padding:4px 10px}
@media (prefers-reduced-motion:no-preference){details[open]>.mbody,details[open]>.iedit{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}
</style>

<div class="wrap" id="app">
  <header class="top"><h1>ChatiChef</h1><span class="wk" id="wk">Cargando…</span></header>
<div class="upd" id="upd" aria-live="polite"></div>
  <main id="view"><div class="empty">Cargando el tablero…</div></main>
</div>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
const TABS=[["hoy","Hoy"],["resumen","Resumen"],["semana","Semana"],["despensa","Despensa"],["compra","Compra"],["notas","Notas"]];
const PLACES=[["nevera","Nevera"],["congelador","Congelador"],["despensa","Despensa 1"],["despensa-2","Despensa 2"]];
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
// Qué comidas cubre el menú que se pide con el botón «Pedir el menú». Cámbialo a tu gusto.
const COBERTURA="Comidas y cenas de lunes a domingo";
const LS="chatichef-tablero";
const S={db:null,state:"loading",cfg:null,meals:[],inv:[],shop:[],canWrite:true,tab:"hoy",donePanel:null,used:{},confirmDel:null,busy:false,sel:{},reqs:[]};
const open=new Set();
let checks={};
try{const raw=JSON.parse(localStorage.getItem(LS)||"{}");checks=raw.checks||{};if(raw.tab)S.tab=raw.tab;(raw.open||[]).forEach(k=>open.add(k));}catch(e){}
if(/^#(hoy|resumen|semana|despensa|compra|notas)$/.test(location.hash))S.tab=location.hash.slice(1);
function persist(){try{localStorage.setItem(LS,JSON.stringify({checks,tab:S.tab,open:[...open].slice(-40)}))}catch(e){}}

/* fechas */
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(iso,n){const [y,m,d]=iso.split("-").map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return t.toISOString().slice(0,10)}
function diffDays(a,b){const p=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(a)-p(b))/864e5)}
function dayName(iso){const [y,m,d]=iso.split("-").map(Number);const t=new Date(Date.UTC(y,m-1,d));return DIAS[t.getUTCDay()]}
function fmtDate(iso){if(!iso)return"";const [y,m,d]=iso.split("-").map(Number);return d+" "+MESES[m-1]}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtQty(q,u){if(q==null)return"¿cantidad?";const n=Math.round(q*10)/10;return n.toLocaleString("es-ES")+(u?" "+u:"")}

/* datos derivados */
function week(){return S.cfg&&S.cfg.week}
/* Semanas visibles: config/current.weeks (p. ej. ["2026-11-16","2026-11-23"]) más config/current.week. Hoy mira todas; Semana y Compra tienen selector. */
function weeks(){if(!S.cfg)return[];const l=(Array.isArray(S.cfg.weeks)?S.cfg.weeks:[]).concat(S.cfg.week?[S.cfg.week]:[]);return [...new Set(l.filter(Boolean))].sort()}
function weekMeals(w){w=w||week();return S.meals.filter(m=>m.week===w)}
function liveMeals(){const ws=weeks();return S.meals.filter(m=>ws.includes(m.week))}
function weekOfDate(iso){const ws=weeks();if(!ws.length)return null;const hit=ws.filter(w=>{const d=diffDays(iso,w);return d>=0&&d<=6});if(hit.length)return hit[hit.length-1];if(iso<ws[0])return ws[0];return ws[ws.length-1]}
function selWeek(view){const ws=weeks();const cur=S.sel[view];if(cur&&ws.includes(cur))return cur;return view==="compra"?ws[ws.length-1]:weekOfDate(todayISO())}
function weekSwitch(view){const ws=weeks();if(ws.length<2)return"";const sw=selWeek(view);return '<div class="wswitch" role="group" aria-label="Semana">'+ws.map(w=>'<button type="button" data-act="selWeek" data-view="'+view+'" data-week="'+w+'" aria-pressed="'+(w===sw)+'">Semana del '+fmtDate(w)+'</button>').join("")+'</div>'}
const SLOT_ORDER={comida:0,cena:1,postre:2};
function sortMeals(a,b){return (a.date||"9").localeCompare(b.date||"9")||(SLOT_ORDER[a.slot]??3)-(SLOT_ORDER[b.slot]??3)||(a.order||0)-(b.order||0)}
function invById(id){return S.inv.find(i=>i.id===id)}
function expiry(item){
  if(!item.expires)return null;const d=diffDays(item.expires,todayISO());
  if(item.place==="congelador"){
    if(d>=0)return{cls:"",txt:"Hasta el "+fmtDate(item.expires)};
    if(-d>183)return{cls:"warn",frozen:true,txt:"Fecha pasada hace "+Math.floor(-d/30)+" meses: revísalo"};
    return{cls:"",frozen:true,txt:"Fecha pasada · congelado, sin problema"};
  }
  if(d<0)return{cls:"bad",txt:"Caducado"};if(d===0)return{cls:"bad",txt:"Caduca hoy"};
  if(d===1)return{cls:"warn",txt:"Caduca mañana"};if(d<=3)return{cls:"warn",txt:"Caduca en "+d+" días"};
  return{cls:"",txt:"Hasta el "+fmtDate(item.expires)};
}

/* render diferido mientras se escribe */
let pending=false;
function schedule(){const a=document.activeElement;if(a&&a.closest&&a.closest("#view")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=="checkbox"){pending=true;return}render()}
document.addEventListener("focusout",()=>{if(pending)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest("#view")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=="checkbox")){pending=false;render()}},50)});

let toastTimer;
function toast(msg,undo){const t=document.getElementById("toast");t.innerHTML="<span>"+esc(msg)+"</span>"+(undo?'<button type="button" id="undoBtn">Deshacer</button>':"");t.hidden=false;clearTimeout(toastTimer);
  if(undo)document.getElementById("undoBtn").onclick=async()=>{t.hidden=true;await undo()};
  toastTimer=setTimeout(()=>{t.hidden=true},undo?9000:3500)}

async function w(fn,errMsg){if(!S.db||!S.canWrite)return false;S.busy=true;try{await fn();return true}catch(e){
  const c=e&&e.code;if(c==="invalid_argument"&&!S.writeChecked){S.canWrite=false;render();toast("Este enlace es solo de lectura para ti.")}
  else if(c==="quota_exceeded")toast("La base de datos está llena: borra platos antiguos.");
  else toast(errMsg||"No se ha podido guardar. Prueba otra vez.");return false}finally{S.busy=false}}

/* ---------- VISTAS ---------- */
function mealCard(m,opts){
  opts=opts||{};const key="m:"+m.id;const isOpen=open.has(key)||opts.forceOpen;
  const done=m.status==="done";
  const t=m.times||{};
  const tag={rapida:["ok","Al momento"],media:["","Media"],larga:["warn","Larga"]}[m.tag];
  const who=m.for?" · "+esc(m.for):"";
  let h='<details class="meal'+(done?" done":"")+'" data-key="'+key+'"'+(isOpen?" open":"")+'><summary>';
  h+='<div class="slotline"><span>'+esc(cap(m.slot||""))+who+'</span>'+(m.movedFrom?'<span>movido del '+esc(dayName(m.movedFrom))+'</span>':"")+'</div>';
  h+='<div class="mtitle">'+esc(m.title)+'</div><div class="meta">';
  if(done)h+='<span class="chip ok">Hecha</span>';
  if(m.rating)h+='<span class="chip" aria-label="'+m.rating+' de 5">'+"★".repeat(m.rating)+'</span>';
  if(tag)h+='<span class="chip '+tag[0]+'">'+tag[1]+'</span>';
  if(t.knife!=null)h+='<span class="chip num">Cuchillo '+t.knife+' min</span>';
  if(t.total!=null)h+='<span class="chip num">Total '+t.total+' min</span>';
  if(m.kcal)h+='<span class="chip num">'+m.kcal+' kcal · '+(m.prot||"?")+' g prot</span>';
  h+='</div></summary><div class="mbody">';
  if(m.origin)h+='<p class="origin" style="margin:0">'+esc(m.origin)+'</p>';
  if(t.knife!=null||t.fire!=null||t.total!=null){
    h+='<div class="times"><div><span>Cuchillo</span><b>'+(t.knife??"–")+' min</b></div><div><span>Fuego</span><b>'+(t.fire??"–")+' min</b></div><div><span>Total</span><b>'+(t.total??"–")+' min</b></div></div>';
    if(t.overlap)h+='<p class="small muted" style="margin:0">'+esc(t.overlap)+'</p>';
  }
  if(m.thaw&&m.thaw.text)h+='<div class="notice warn small"><b>Congelado</b>'+esc(m.thaw.text)+(m.thaw.date?" ("+esc(dayName(m.thaw.date))+" "+fmtDate(m.thaw.date)+")":"")+'</div>';
  const ings=m.ingredients||[];
  if(ings.length){h+='<div class="section"><h3>Ingredientes'+(m.servings?" · "+m.servings+(m.servings==1?" ración":" raciones"):"")+'</h3><ul class="ings">';
    ings.forEach((g,i)=>{const ck=m.id+":"+i;const it=g.inv&&invById(g.inv);
      h+='<li><label><input type="checkbox" data-check="'+esc(ck)+'"'+(checks[ck]?" checked":"")+'><span>'+esc(g.text)+(g.inv?'<span class="from">de tu '+esc(it?(PLACES.find(p=>p[0]===it.place)||[0,"despensa"])[1].toLowerCase():"despensa")+'</span>':"")+'</span></label></li>'});
    h+='</ul></div>'}
  const steps=m.steps||[];
  if(steps.length){h+='<div class="section"><h3>Pasos</h3><ol class="steps">'+steps.map(s=>"<li>"+esc(s)+"</li>").join("")+'</ol></div>'}
  (m.notes||[]).forEach(n=>{h+='<div class="section notes"><h3>'+esc(n.title||"Nota")+'</h3><p>'+esc(n.text)+'</p></div>'});
  if(S.canWrite&&S.db){
    if(!done){
      if(S.donePanel===m.id){
        const linked=ings.map((g,i)=>[g,i]).filter(([g])=>g.inv);
        h+='<div class="panel"><b>¿Cuánto has usado de lo que tenías?</b>';
        if(!linked.length)h+='<p class="small muted" style="margin:0">Esta receta no tira de la despensa.</p>';
        linked.forEach(([g,i])=>{const it=invById(g.inv);const unit=(it&&it.unit)||g.unit||"";const v=(S.used[m.id]&&S.used[m.id][i]!=null)?S.used[m.id][i]:(g.qty??"");
          h+='<div class="usedrow"><label for="u-'+m.id+'-'+i+'">'+esc(it?it.name:g.text)+(it?'<br><span class="small muted">quedan '+esc(fmtQty(it.qty,it.unit))+'</span>':"")+'</label><input id="u-'+m.id+'-'+i+'" type="number" inputmode="decimal" min="0" step="any" data-used="'+m.id+'" data-idx="'+i+'" value="'+esc(v)+'"><span class="small">'+esc(unit)+'</span></div>'});
        h+='<p class="small muted" style="margin:0">Pon 0 si al final no lo usaste. Se descuenta de la despensa.</p><div class="actions"><button class="primary" data-act="confirmDone" data-id="'+m.id+'">Guardar como hecha</button><button class="ghost" data-act="cancelDone">Cancelar</button></div></div>';
      }else{
        h+='<div class="actions"><button class="primary" data-act="openDone" data-id="'+m.id+'">Marcar como hecha</button>';
        if(m.date){h+='<button data-act="push" data-id="'+m.id+'">Correr un día</button><button data-act="swap" data-id="'+m.id+'">Cambiar con mañana</button>'}
        h+='</div>';
        if(m.date)h+='<p class="small muted" style="margin:0">«Correr un día» mueve este plato y los siguientes del mismo turno. «Cambiar con mañana» lo intercambia con el de mañana.</p>';
      }
    }else{
      h+='<div class="panel"><b>¿Qué tal salió?</b><div class="stars" role="group" aria-label="Nota">';
      for(let s=1;s<=5;s++)h+='<button type="button" class="'+((m.rating||0)>=s?"on":"")+'" data-act="rate" data-id="'+m.id+'" data-v="'+s+'" aria-label="'+s+' de 5">★</button>';
      h+='</div><textarea id="c-'+m.id+'" placeholder="Qué cambiarías, qué no os gustó, si repetiríais…">'+esc(m.comment||"")+'</textarea>';
      h+='<div class="actions"><button data-act="saveComment" data-id="'+m.id+'">Guardar comentario</button><button class="ghost" data-act="undoDone" data-id="'+m.id+'">No la he hecho</button></div>';
      if((m.used||[]).length)h+='<p class="small muted" style="margin:0">Descontado: '+m.used.map(u=>esc((invById(u.inv)||{name:u.inv}).name)+" "+esc(fmtQty(u.qty,u.unit))).join(" · ")+'</p>';
      h+='</div>';
    }
  }
  h+='</div></details>';return h;
}

function noMenu(){return '<div class="empty">Todavía no hay menú cargado. Pídeselo a Claude en el chat de la semana y aparecerá aquí.</div>'}

function viewHoy(){
  const today=todayISO();let h='<div class="section">';
  const alerts=S.inv.filter(i=>{const e=expiry(i);return e&&!e.frozen&&(e.cls==="bad"||e.cls==="warn")&&i.qty!==0}).sort((a,b)=>a.expires.localeCompare(b.expires));
  const thaws=liveMeals().filter(m=>m.thaw&&m.thaw.date===today&&m.status!=="done");
  if(thaws.length)h+='<div class="notice warn"><b>Hoy toca bajar del congelador</b><ul>'+thaws.map(m=>"<li>"+esc(m.thaw.text)+" <span class='small'>(para "+esc(m.title)+")</span></li>").join("")+'</ul></div>';
  if(alerts.length)h+='<div class="notice '+(alerts.some(a=>expiry(a).cls==="bad")?"bad":"warn")+'"><b>Gastar pronto</b><ul>'+alerts.map(i=>"<li>"+esc(i.name)+" · "+esc(fmtQty(i.qty,i.unit))+" · "+esc(expiry(i).txt.toLowerCase())+"</li>").join("")+'</ul></div>';
  const unknown=S.inv.filter(i=>i.qty==null).length;
  if(unknown)h+='<div class="notice"><span>Hay <b>'+unknown+'</b> cosas en la despensa sin cantidad. <button class="ghost" data-act="tab" data-tab="despensa" style="min-height:0;padding:2px 8px">Revisarlas</button></span></div>';
  h+='</div>';
  if(!S.cfg)return h+noMenu();
  const tm=liveMeals().filter(m=>m.date===today).sort(sortMeals);
  h+='<div class="section"><div class="dayhead today"><h2>'+cap(dayName(today))+' '+fmtDate(today)+'</h2></div>';
  h+=tm.length?tm.map(m=>mealCard(m)).join(""):'<div class="empty">Hoy no hay nada planificado.</div>';
  h+='</div>';
  const tom=addDays(today,1);const nm=liveMeals().filter(m=>m.date===tom).sort(sortMeals);
  if(nm.length)h+='<div class="section"><h3>Mañana, '+dayName(tom)+'</h3>'+nm.map(m=>mealCard(m)).join("")+'</div>';
  return h;
}

function viewSemana(){
  if(!S.cfg)return noMenu();
  const sw=selWeek("semana");
  const ms=weekMeals(sw).filter(m=>m.slot!=="postre").sort(sortMeals);const today=todayISO();
  const days=[...new Set(ms.map(m=>m.date))];
  let h=reqView()+weekSwitch("semana");
  const sum=(S.cfg.summaries&&S.cfg.summaries[sw])||(sw===S.cfg.week?S.cfg.summary:"");
  if(sum)h+='<div class="notice small">'+esc(sum)+'</div>';
  days.forEach(d=>{h+='<div class="daygroup"><div class="dayhead'+(d===today?" today":"")+'"><h2>'+cap(dayName(d))+'</h2><span class="muted small">'+fmtDate(d)+(d===today?" · hoy":"")+'</span></div>'+ms.filter(m=>m.date===d).map(m=>mealCard(m)).join("")+'</div>'});
  const ps=weekMeals(sw).filter(m=>m.slot==="postre").sort(sortMeals);
  if(ps.length)h+='<div class="daygroup"><div class="dayhead"><h2>Postres</h2></div>'+ps.map(m=>mealCard(m)).join("")+'</div>';
  return (ms.length||ps.length)?h:h+noMenu();
}

function invItem(i){
  const key="i:"+i.id;const e=expiry(i);
  let h='<details class="inv" data-key="'+key+'"'+(open.has(key)?" open":"")+'><summary><span class="iname">'+esc(i.name)+'</span><span class="iqty'+(i.qty==null?" unknown":"")+'">'+esc(fmtQty(i.qty,i.unit))+'</span>';
  const sub=[];if(e)sub.push('<span class="chip '+e.cls+'">'+esc(e.txt)+'</span>');if(i.opened)sub.push('<span class="chip">Abierto el '+fmtDate(i.opened)+'</span>');if(i.qty===0)sub.push('<span class="chip bad">Se ha acabado</span>');if(i.note)sub.push('<span class="small muted">'+esc(i.note)+'</span>');
  if(sub.length)h+='<span class="isub">'+sub.join("")+'</span>';
  h+='</summary>';
  if(S.canWrite&&S.db){
    h+='<div class="iedit"><div class="field"><label for="nm-'+i.id+'">Nombre</label><input id="nm-'+i.id+'" type="text" value="'+esc(i.name||"")+'" placeholder="Merluza congelada (Lidl)"></div><div class="grid2"><div class="field"><label for="q-'+i.id+'">Cantidad ('+esc(i.unit||"ud")+')</label><input id="q-'+i.id+'" type="number" inputmode="decimal" min="0" step="any" value="'+(i.qty==null?"":esc(i.qty))+'"></div>';
    h+='<div class="field"><label for="x-'+i.id+'">Caduca</label><input id="x-'+i.id+'" type="date" value="'+esc(i.expires||"")+'">'+(i.expires?'<button type="button" class="ghost clr" data-act="clrDate" data-field="expires" data-id="'+i.id+'">Quitar fecha</button>':"")+'</div>';
    h+='<div class="field"><label for="p-'+i.id+'">Dónde</label><select id="p-'+i.id+'">'+PLACES.map(p=>'<option value="'+p[0]+'"'+(i.place===p[0]?" selected":"")+'>'+p[1]+'</option>').join("")+'</select></div>';
    h+='<div class="field"><label for="o-'+i.id+'">Abierto el</label><input id="o-'+i.id+'" type="date" value="'+esc(i.opened||"")+'">'+(i.opened?'<button type="button" class="ghost clr" data-act="clrDate" data-field="opened" data-id="'+i.id+'">Quitar fecha</button>':"")+'</div></div>';
    h+='<div class="field"><label for="n-'+i.id+'">Nota</label><input id="n-'+i.id+'" type="text" value="'+esc(i.note||"")+'"></div>';
    h+='<div class="actions"><button class="primary" data-act="saveInv" data-id="'+i.id+'">Guardar</button><button data-act="emptyInv" data-id="'+i.id+'">Se ha acabado</button><button data-act="dupInv" data-id="'+i.id+'">Añadir otro igual</button>';
    h+=S.confirmDel===i.id?'<button class="danger" data-act="delInv" data-id="'+i.id+'">Sí, quitar de la lista</button><button class="ghost" data-act="cancelDel">No</button>':'<button class="ghost danger" data-act="askDel" data-id="'+i.id+'">Quitar</button>';
    h+='</div>';
    if((i.moves||[]).length)h+='<div><h3>Últimos movimientos</h3><ul class="moves">'+i.moves.slice().reverse().slice(0,6).map(mv=>"<li>"+esc(fmtDate((mv.at||"").slice(0,10)))+" · "+(mv.delta>0?"+":"")+esc(fmtQty(mv.delta,i.unit))+" · "+esc(mv.why||"")+"</li>").join("")+'</ul></div>';
    h+='</div>';
  }
  return h+'</details>';
}

function viewDespensa(){
  let h='';
  if(S.canWrite&&S.db){
    const key="add-inv";
    h+='<details class="inv" data-key="'+key+'"'+(open.has(key)?" open":"")+'><summary><span class="iname">Añadir algo</span><span class="iqty">+</span></summary><div class="iedit">';
    h+='<div class="field"><label for="ai-name">Qué es</label><input id="ai-name" type="text" placeholder="Leche de coco, lata abierta"></div>';
    h+='<div class="grid2"><div class="field"><label for="ai-qty">Cantidad</label><input id="ai-qty" type="number" inputmode="decimal" min="0" step="any"></div>';
    h+='<div class="field"><label for="ai-unit">Unidad</label><select id="ai-unit"><option>g</option><option>ml</option><option>ud</option><option>lata</option><option>bote</option><option>paquete</option></select></div>';
    h+='<div class="field"><label for="ai-place">Dónde</label><select id="ai-place">'+PLACES.map(p=>'<option value="'+p[0]+'">'+p[1]+'</option>').join("")+'</select></div>';
    h+='<div class="field"><label for="ai-exp">Caduca</label><input id="ai-exp" type="date"></div></div>';
    h+='<div class="actions"><button class="primary" data-act="addInv">Añadir</button></div></div></details>';
  }
  if(!S.inv.length)return h+'<div class="empty">La despensa está vacía. Añade lo que tengas o díselo a Claude y lo carga.</div>';
  const known=PLACES.map(p=>p[0]);
  h+='<div class="places">';
  PLACES.forEach(([p,label])=>{
    const items=S.inv.filter(i=>{const pl=i.place||"despensa";return i.qty!==0&&(pl===p||(p==="despensa"&&!known.includes(pl)))}).sort((a,b)=>((a.qty===0)-(b.qty===0))||(a.expires||"9999").localeCompare(b.expires||"9999")||a.name.localeCompare(b.name,"es"));
    const live=items.filter(i=>i.qty!==0);
    const soon=live.filter(i=>{const e=expiry(i);return e&&!e.frozen&&(e.cls==="bad"||e.cls==="warn")}).length;
    const old=live.filter(i=>{const e=expiry(i);return e&&e.frozen&&e.cls==="warn"}).length;
    const unk=live.filter(i=>i.qty==null).length;
    const key="pl:"+p;
    h+='<details class="place" data-key="'+key+'"'+(open.has(key)?" open":"")+'><summary><span class="pname">'+esc(label)+'</span><span class="pcount">'+live.length+(live.length===1?" cosa":" cosas")+'</span><span class="psub">';
    if(soon)h+='<span class="chip warn">'+soon+' caduca'+(soon===1?"":"n")+' pronto</span>';
    if(old)h+='<span class="chip warn">'+old+' para revisar</span>';
    if(unk)h+='<span class="chip">'+unk+' sin cantidad</span>';
    h+='</span></summary><div class="pbody">';
    h+=items.length?items.map(invItem).join(""):'<div class="empty small">Vacía. Para traer algo aquí, ábrelo en su sitio y cambia «Dónde».</div>';
    h+='</div></details>';
  });
  const gone=S.inv.filter(i=>i.qty===0).sort((a,b)=>a.name.localeCompare(b.name,"es"));
  if(gone.length){
    const key="pl:acabado";
    h+='<details class="place gone" data-key="'+key+'"'+(open.has(key)?" open":"")+'><summary><span class="pname">Se ha acabado</span><span class="pcount">'+gone.length+(gone.length===1?" cosa":" cosas")+'</span></summary><div class="pbody">';
    h+='<p class="small muted" style="margin:0">Cuando lo compres, ábrelo, pon la cantidad y dale a Guardar: vuelve solo a su sitio.</p>';
    h+=gone.map(invItem).join("")+'</div></details>';
  }
  return h+'</div>';
}

function viewCompra(){
  if(!S.cfg)return noMenu();
  const csw=selWeek("compra");const items=S.shop.filter(s=>s.week===csw);
  const buy=items.filter(s=>s.kind!=="tengo");const have=items.filter(s=>s.kind==="tengo");
  const done=buy.filter(s=>s.checked).length;
  let h=weekSwitch("compra")+'<div class="row" style="justify-content:space-between"><span class="counter num">'+done+' de '+buy.length+' en el carro</span>';
  if(S.canWrite&&S.db&&done)h+='<button class="ghost" data-act="uncheckAll">Desmarcar todo</button>';
  h+='</div>';
  if(S.canWrite&&S.db)h+='<div class="row"><input id="add-shop" type="text" placeholder="Añadir a la compra" style="flex:1;min-width:0"><button data-act="addShop">Añadir</button></div>';
  if(!buy.length)h+='<div class="empty">No hay nada que comprar esta semana.</div>';
  const secs=[...new Set(buy.map(s=>s.section||"Otros"))];
  secs.forEach(sec=>{h+='<div class="shopsec"><h3>'+esc(sec)+'</h3><ul class="ings">'+buy.filter(s=>(s.section||"Otros")===sec).sort((a,b)=>(a.order||0)-(b.order||0)).map(s=>'<li><label><input type="checkbox" data-shop="'+s.id+'"'+(s.checked?" checked":"")+(S.canWrite&&S.db?"":" disabled")+'><span>'+esc(s.text)+(s.store?' <span class="chip warn">'+esc(s.store)+'</span>':"")+(s.dest?' <span class="small muted">→ '+esc(s.dest)+'</span>':"")+'</span></label></li>').join("")+'</ul></div>'});
  if(have.length)h+='<div class="shopsec"><h3>Ya lo tengo · a dónde va</h3><ul class="ings">'+have.map(s=>'<li style="padding:4px 0">'+esc(s.text)+(s.dest?' <span class="small muted">→ '+esc(s.dest)+'</span>':"")+'</li>').join("")+'</ul></div>';
  return h;
}

function nextMonday(){const t=todayISO();const [y,m,d]=t.split("-").map(Number);const wd=new Date(Date.UTC(y,m-1,d)).getUTCDay();return addDays(t,((8-wd)%7)||7)}
function weekLoaded(wk){return weeks().includes(wk)||S.meals.some(m=>m.week===wk)}
function targetWeek(){let wk=nextMonday();if(weekLoaded(wk))wk=addDays(wk,7);return wk}
function fmtTime(iso){const d=new Date(iso);if(!iso||isNaN(d))return"";try{return d.toLocaleString("es-ES",{weekday:"short",day:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Madrid"})}catch(e){return""}}
/* Pedir el menú: deja requests/menu-<lunes> en la base de datos; una tarea programada de Claude lo recoge cada hora */
function reqView(){
  if(!S.db)return"";
  const wk=targetWeek();const r=(S.reqs||[]).find(x=>x.id==="menu-"+wk);
  const ST={pending:["warn","Pedido"],working:["warn","Montándose"],done:["ok","Listo"],error:["bad","Error"]};
  const st=r&&ST[r.status];
  let h='<details class="inv" data-key="req"'+(open.has("req")?" open":"")+'><summary><span class="iname">Pedir a Claude el menú de la semana del '+fmtDate(wk)+'</span><span class="iqty">'+(st?'<span class="chip '+st[0]+'">'+st[1]+'</span>':"+")+'</span></summary><div class="iedit">';
  if(r){
    if(r.status==="pending")h+='<p class="small" style="margin:0">Pedido el '+esc(fmtTime(r.requestedAt))+'. Claude mira los pedidos cada hora: en menos de una hora tendrás el menú aquí.</p>';
    else if(r.status==="working")h+='<p class="small" style="margin:0">Claude lo está montando'+(r.startedAt?' desde el '+esc(fmtTime(r.startedAt)):"")+'.</p>';
    else if(r.status==="done")h+='<p class="small" style="margin:0">Listo: ya está en el tablero. Revísalo y dile en el chat si te parece bien.</p>';
    else if(r.status==="error")h+='<p class="small" style="margin:0">No se ha podido montar'+(r.error?": "+esc(r.error):"")+'.</p>';
    if(r.notes)h+='<p class="small muted" style="margin:0">Tus notas: '+esc(r.notes)+'</p>';
    if(S.canWrite&&(r.status==="pending"||r.status==="error"))h+='<div class="actions"><button class="ghost danger" data-act="reqCancel" data-id="menu-'+wk+'">'+(r.status==="error"?"Borrar para volver a pedirlo":"Cancelar el pedido")+'</button></div>';
  }else if(S.canWrite){
    h+='<p class="small muted" style="margin:0">'+esc(COBERTURA)+'. Claude mira la despensa y tus notas, lo carga aquí y no lo guarda en ningún sitio más hasta que le digas que sí.</p>';
    h+='<div class="field"><label for="req-notes">Notas para Claude</label><textarea id="req-notes" placeholder="Días que coméis fuera, lo que os ha sobrado, algo que os apetezca o no…"></textarea></div>';
    h+='<label class="row small" style="gap:8px;cursor:pointer"><input type="checkbox" id="req-postres" checked style="width:20px;height:20px;min-height:0;accent-color:var(--accent)"> Con postres</label>';
    h+='<div class="actions"><button class="primary" data-act="reqMenu" data-id="menu-'+wk+'" data-week="'+wk+'">Pedir el menú</button></div>';
  }
  return h+'</div></details>';
}

function viewResumen(){
  if(!S.cfg)return noMenu();
  const sw=selWeek("resumen");const today=todayISO();
  const ms=weekMeals(sw).filter(m=>m.slot!=="postre"&&m.date).sort(sortMeals);
  const ps=weekMeals(sw).filter(m=>m.slot==="postre").sort(sortMeals);
  const AB=["Do","Lu","Ma","Mi","Ju","Vi","Sá"];
  let h='<div class="rs">'+weekSwitch("resumen");
  if(!ms.length)return h+noMenu()+'</div>';
  h+='<div class="rs-list">';let prev=null;
  ms.forEach(m=>{const same=m.date===prev;prev=m.date;const t=m.times||{};
    const [y,mo,da]=m.date.split("-").map(Number);const wd=new Date(Date.UTC(y,mo-1,da)).getUTCDay();
    const who=m.for&&m.for!=="para 2"?cap(m.for)+(m.servings==1?" · 1 ración":""):"";
    h+='<button type="button" class="rs-row p-'+esc(m.protein||"otro")+(same?" same":"")+(m.status==="done"?" done":"")+(m.date===today?" today":"")+'" data-act="openMeal" data-id="'+esc(m.id)+'">'
      +'<span class="rs-day"><b>'+AB[wd]+'</b><span>'+esc(m.slot||"")+'</span></span>'
      +'<span class="rs-dish">'+esc(m.short||m.title)+(m.badge?'<span class="rs-tag">'+esc(m.badge)+'</span>':"")+(who?'<small>'+esc(who)+'</small>':"")+'</span>'
      +'<span class="rs-n"><b>'+(m.kcal||"–")+'</b><span>'+(m.prot!=null?m.prot+" g":"")+'</span></span>'
      +'<span class="rs-n"><b>'+(t.knife!=null?t.knife+"′":"–")+'</b><span>'+(t.total!=null?t.total+"′ total":"")+'</span></span></button>'});
  h+='</div>';
  if(ps.length){h+='<div class="rs-postres">'+ps.slice(0,2).map(m=>'<button type="button" class="rs-postre" data-act="openMeal" data-id="'+esc(m.id)+'"><span class="cap">Postre'+(m.badge?" "+esc(m.badge.toLowerCase()):"")+'</span><b>'+esc(m.short||m.title)+'</b><span class="sub">'+(m.yield?esc(m.yield)+" · ":"")+(m.kcal?m.kcal+" kcal":"")+'</span></button>').join("")+'</div>'}
  const sum=(S.cfg.summaries&&S.cfg.summaries[sw])||(sw===S.cfg.week?S.cfg.summary:"");
  h+='<div class="rs-foot">'+(sum?'<span>'+esc(sum)+'</span>':"")+'<span class="rs-legend"><span class="p-carne"><i></i>Carne</span><span class="p-pescado"><i></i>Pescado y marisco</span><span class="p-huevo"><i></i>Huevo</span><span class="p-legumbre"><i></i>Legumbre</span><span>kcal y g por ración · ′ = minutos de cuchillo</span></span></div>';
  return h+'</div>';
}

function viewNotas(){
  const rated=S.meals.filter(m=>m.status==="done").sort((a,b)=>(b.doneAt||"").localeCompare(a.doneAt||""));
  if(!rated.length)return '<div class="empty">Cuando marquéis platos como hechos y les pongáis nota, aparecerán aquí. Claude las lee antes de repetir recetas.</div>';
  const weeks=[...new Set(rated.map(m=>m.week))];let h="";
  weeks.forEach(wk=>{h+='<div class="section"><h3>Semana del '+fmtDate(wk)+'</h3>';
    rated.filter(m=>m.week===wk).forEach(m=>{h+='<div class="notice"><div class="row" style="justify-content:space-between"><b>'+esc(m.title)+'</b><span style="color:var(--star)" aria-label="'+(m.rating||0)+' de 5">'+(m.rating?"★".repeat(m.rating):'<span class="small muted">sin nota</span>')+'</span></div>'+(m.comment?'<span class="small">'+esc(m.comment)+'</span>':"")+'</div>'});
    h+='</div>'});
  return h;
}

/* Fechas de actualización: menú = config/current.updatedAt; inventario = la updatedAt más reciente de inventory/* */
function fmtStamp(iso){
  const d=new Date(iso);if(!iso||isNaN(d))return null;
  try{return d.toLocaleString("es-ES",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Madrid"})}catch(e){return d.toISOString().slice(0,16).replace("T"," ")}
}
function updLine(){
  if(S.state!=="ready")return "";
  const parts=[];
  const m=S.cfg&&S.cfg.updatedAt?fmtStamp(S.cfg.updatedAt):null;
  parts.push('<span>Menú actualizado: <b>'+(m||"sin fecha")+'</b></span>');
  let last=null;
  S.inv.forEach(i=>{if(i.updatedAt&&(!last||i.updatedAt>last))last=i.updatedAt});
  const iv=last?fmtStamp(last):null;
  const age=last?(Date.now()-new Date(last).getTime())/864e5:null;
  parts.push('<span>Inventario actualizado: <b>'+(iv||"sin fecha")+'</b>'+(age!==null&&age>7?' <span class="stale">· hace más de una semana</span>':"")+'</span>');
  return parts.join("");
}
function render(){
  pending=false;
  document.body.classList.toggle("fit",S.tab==="resumen"&&S.state==="ready"&&!!S.cfg);
  const tabs=document.getElementById("tabs");
  const warnCount=S.inv.filter(i=>{const e=expiry(i);return e&&e.cls==="bad"&&i.qty!==0}).length;
  tabs.innerHTML=TABS.map(([k,l])=>'<button type="button" data-act="tab" data-tab="'+k+'"'+(S.tab===k?' aria-current="page"':"")+'>'+l+(k==="despensa"&&warnCount?'<span class="badge">'+warnCount+'</span>':"")+'</button>').join("");
  document.getElementById("wk").textContent=S.cfg?(S.cfg.label||("Semana del "+fmtDate(S.cfg.week)))+(S.cfg.version?" · "+S.cfg.version:""):"";
  document.getElementById("upd").innerHTML=updLine();
  const v=document.getElementById("view");
  if(S.state==="loading"){v.innerHTML='<div class="empty">Cargando el tablero…</div>';return}
  if(S.state==="offline"){v.innerHTML='<div class="empty">No se pueden cargar los datos. Abre este enlace con tu sesión de Claude iniciada.</div>';return}
  let h=S.canWrite?"":'<div class="notice small">Puedes verlo, pero no cambiarlo. Pide a quien lo creó que te invite como editor.</div>';
  h+={hoy:viewHoy,resumen:viewResumen,semana:viewSemana,despensa:viewDespensa,compra:viewCompra,notas:viewNotas}[S.tab]();
  v.innerHTML='<div class="section" style="gap:14px">'+h+'</div>';
}

/* ---------- ACCIONES ---------- */
const now=()=>new Date().toISOString();
async function adjustInv(id,delta,why){
  const it=invById(id);if(!it||it.qty==null)return;
  const q=Math.max(0,Math.round((it.qty+delta)*100)/100);
  const moves=(it.moves||[]).concat([{at:now(),delta,why}]).slice(-15);
  it.qty=q;it.moves=moves; // optimista para la siguiente iteración
  await S.db.doc("inventory/"+id).update({qty:q,moves,updatedAt:now()});
}
async function confirmDone(id){
  const m=S.meals.find(x=>x.id===id);if(!m)return;
  const used=[];const agg={};
  (m.ingredients||[]).forEach((g,i)=>{if(!g.inv)return;const raw=S.used[id]&&S.used[id][i]!=null?S.used[id][i]:g.qty;const v=parseFloat(String(raw).replace(",","."));if(!(v>0))return;agg[g.inv]=(agg[g.inv]||0)+v});
  Object.entries(agg).forEach(([inv,qty])=>{const it=invById(inv);used.push({inv,qty,unit:it?it.unit:""})});
  const ok=await w(async()=>{for(const u of used)await adjustInv(u.inv,-u.qty,"Hecha: "+m.title);await S.db.doc("meals/"+id).update({status:"done",doneAt:now(),used})});
  if(ok){S.donePanel=null;delete S.used[id];toast(used.length?"Hecha. Descontado de la despensa.":"Marcada como hecha.")}
}
async function undoDone(id){
  const m=S.meals.find(x=>x.id===id);if(!m)return;
  await w(async()=>{for(const u of (m.used||[]))await adjustInv(u.inv,u.qty,"Deshecha: "+m.title);await S.db.doc("meals/"+id).update({status:"pending",doneAt:null,used:[]})});
}
async function push(id){
  const m=S.meals.find(x=>x.id===id);if(!m||!m.date)return;
  const list=weekMeals(m.week).filter(x=>x.slot===m.slot&&x.status!=="done"&&x.date&&x.date>=m.date).sort((a,b)=>b.date.localeCompare(a.date));
  const prev=list.map(x=>({id:x.id,date:x.date,movedFrom:x.movedFrom||null}));
  const ok=await w(async()=>{for(const x of list)await S.db.doc("meals/"+x.id).update({date:addDays(x.date,1),movedFrom:x.movedFrom||x.date})});
  if(ok)toast(list.length===1?"Pasado a mañana.":"Corridos "+list.length+" platos un día.",async()=>{await w(async()=>{for(const p of prev.slice().reverse())await S.db.doc("meals/"+p.id).update({date:p.date,movedFrom:p.movedFrom})});toast("Deshecho.")});
}
async function swap(id){
  const m=S.meals.find(x=>x.id===id);if(!m||!m.date)return;const tom=addDays(m.date,1);
  const n=weekMeals(m.week).find(x=>x.slot===m.slot&&x.date===tom&&x.status!=="done");
  const prev=[{id:m.id,date:m.date,movedFrom:m.movedFrom||null}].concat(n?[{id:n.id,date:n.date,movedFrom:n.movedFrom||null}]:[]);
  const ok=await w(async()=>{await S.db.doc("meals/"+m.id).update({date:tom,movedFrom:m.movedFrom||m.date});if(n)await S.db.doc("meals/"+n.id).update({date:m.date,movedFrom:n.movedFrom||n.date})});
  if(ok)toast(n?"Cambiado con «"+n.title+"».":"Pasado a mañana.",async()=>{await w(async()=>{for(const p of prev)await S.db.doc("meals/"+p.id).update({date:p.date,movedFrom:p.movedFrom})});toast("Deshecho.")});
}
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"cosa"}

document.addEventListener("toggle",e=>{const d=e.target;if(!(d instanceof HTMLDetailsElement)||!d.dataset.key)return;if(d.open)open.add(d.dataset.key);else open.delete(d.dataset.key);persist()},true);
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.used){(S.used[t.dataset.used]=S.used[t.dataset.used]||{})[t.dataset.idx]=t.value}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.dataset&&t.dataset.check){checks[t.dataset.check]=t.checked;if(!t.checked)delete checks[t.dataset.check];persist()}
  if(t.dataset&&t.dataset.shop){const id=t.dataset.shop;const ok=await w(()=>S.db.doc("shopping/"+id).update({checked:t.checked}));if(!ok)t.checked=!t.checked}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="tab"){S.tab=b.dataset.tab;persist();try{history.replaceState(null,"","#"+S.tab)}catch(_){}render();window.scrollTo(0,0);return}
  if(a==="selWeek"){S.sel[b.dataset.view]=b.dataset.week;render();return}
  if(a==="openMeal"){const m=S.meals.find(x=>x.id===id);if(!m)return;S.tab="semana";S.sel.semana=m.week;open.add("m:"+id);persist();try{history.replaceState(null,"","#semana")}catch(_){}render();const el=document.querySelector('[data-key="m:'+id+'"]');if(el)el.scrollIntoView({block:"start"});return}
  if(S.busy)return;
  if(a==="reqMenu"){const wk=b.dataset.week;const nt=document.getElementById("req-notes");const pc=document.getElementById("req-postres");
    if(await w(()=>S.db.doc("requests/"+id).set({type:"menu",week:wk,status:"pending",coverage:COBERTURA,postres:!!(pc&&pc.checked),notes:(nt?nt.value:"").trim(),requestedAt:now()}))){open.add("req");persist();toast("Pedido. En menos de una hora lo tienes aquí.")}return}
  if(a==="reqCancel"){if(await w(()=>S.db.doc("requests/"+id).delete()))toast("Pedido cancelado.");return}
  if(a==="openDone"){S.donePanel=id;render();return}
  if(a==="cancelDone"){S.donePanel=null;render();return}
  if(a==="confirmDone"){b.disabled=true;await confirmDone(id);return}
  if(a==="undoDone"){await undoDone(id);return}
  if(a==="push"){b.disabled=true;await push(id);return}
  if(a==="swap"){b.disabled=true;await swap(id);return}
  if(a==="rate"){const v=+b.dataset.v;const m=S.meals.find(x=>x.id===id);await w(()=>S.db.doc("meals/"+id).update({rating:m&&m.rating===v?0:v,ratedAt:now()}));return}
  if(a==="saveComment"){const txt=document.getElementById("c-"+id).value.trim();if(await w(()=>S.db.doc("meals/"+id).update({comment:txt,ratedAt:now()})))toast("Comentario guardado.");return}
  if(a==="saveInv"){const it=invById(id);if(!it)return;const qv=document.getElementById("q-"+id).value.trim();const q=qv===""?null:parseFloat(qv.replace(",","."));
    const nm=document.getElementById("nm-"+id).value.trim();
    const data={name:nm||it.name,qty:q,expires:document.getElementById("x-"+id).value||null,opened:document.getElementById("o-"+id).value||null,place:document.getElementById("p-"+id).value,note:document.getElementById("n-"+id).value.trim(),updatedAt:now()};
    if(q!==it.qty&&q!=null)data.moves=(it.moves||[]).concat([{at:now(),delta:Math.round((q-(it.qty||0))*100)/100,why:"Ajuste a mano"}]).slice(-15);
    if(await w(()=>S.db.doc("inventory/"+id).update(data))){open.delete("i:"+id);persist();toast("Guardado.")}return}
  if(a==="emptyInv"){const it=invById(id);if(await w(()=>S.db.doc("inventory/"+id).update({qty:0,updatedAt:now(),moves:(it.moves||[]).concat([{at:now(),delta:-(it.qty||0),why:"Se ha acabado"}]).slice(-15)})))toast("Marcado como acabado.");return}
  if(a==="dupInv"){const it=invById(id);if(!it)return;const nid=slug(it.name)+"-"+Date.now().toString(36).slice(-5);
    const data={name:it.name,qty:null,unit:it.unit||"ud",place:it.place||"despensa",expires:null,opened:null,note:"",moves:[],updatedAt:now()};
    if(await w(()=>S.db.doc("inventory/"+nid).set(data))){open.delete("i:"+id);open.add("i:"+nid);open.add("pl:"+(it.place||"despensa"));persist();toast("Copia añadida debajo: ponle marca, cantidad y fecha.")}return}
  if(a==="clrDate"){const f=b.dataset.field;if(f!=="expires"&&f!=="opened")return;
    const inp=document.getElementById((f==="expires"?"x-":"o-")+id);if(inp)inp.value="";
    if(await w(()=>S.db.doc("inventory/"+id).update({[f]:null,updatedAt:now()})))toast(f==="expires"?"Fecha de caducidad quitada.":"Fecha de apertura quitada.");return}
  if(a==="askDel"){S.confirmDel=id;render();return}
  if(a==="cancelDel"){S.confirmDel=null;render();return}
  if(a==="delInv"){S.confirmDel=null;if(await w(()=>S.db.doc("inventory/"+id).delete()))toast("Quitado.");return}
  if(a==="addInv"){const name=document.getElementById("ai-name").value.trim();if(!name){toast("Escribe qué es.");return}
    const qv=document.getElementById("ai-qty").value.trim();let nid=slug(name);if(invById(nid))nid+="-"+Date.now().toString(36).slice(-4);
    const data={name,qty:qv===""?null:parseFloat(qv.replace(",",".")),unit:document.getElementById("ai-unit").value,place:document.getElementById("ai-place").value,expires:document.getElementById("ai-exp").value||null,opened:null,note:"",moves:[],updatedAt:now()};
    if(await w(()=>S.db.doc("inventory/"+nid).set(data))){open.delete("add-inv");persist();toast("Añadido.")}return}
  if(a==="addShop"){const inp=document.getElementById("add-shop");const txt=inp.value.trim();if(!txt)return;
    if(await w(()=>S.db.collection("shopping").doc().set({week:selWeek("compra"),text:txt,section:"Añadido a mano",kind:"falta",checked:false,order:Date.now()}))){inp.value="";toast("Añadido a la compra.")}return}
  if(a==="uncheckAll"){const list=S.shop.filter(s=>s.week===selWeek("compra")&&s.checked);await w(async()=>{for(const s of list)await S.db.doc("shopping/"+s.id).update({checked:false})});return}
});

/* ---------- ARRANQUE ---------- */
render();
(async()=>{
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){S.state="offline";render();return}
  S.db=db;const got={cfg:0,meals:0,inv:0,shop:0};
  const ready=k=>{got[k]=1;if(got.cfg&&got.meals&&got.inv&&got.shop)S.state="ready";schedule()};
    db.doc("config/current").onSnapshot(s=>{S.cfg=s.exists?s.data():null;ready("cfg")},()=>ready("cfg"));
  db.collection("meals").onSnapshot(s=>{S.meals=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready("meals")},()=>ready("meals"));
  db.collection("inventory").onSnapshot(s=>{S.inv=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready("inv")},()=>ready("inv"));
  db.collection("shopping").onSnapshot(s=>{S.shop=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready("shop")},()=>ready("shop"));
  db.collection("requests").onSnapshot(s=>{S.reqs=s.docs.map(d=>Object.assign({id:d.id},d.data()));schedule()},()=>{});
  try{const u=await window.claude.use("user");if(u){const c=await u.can("data.write");if(c===false){S.canWrite=false;schedule()}else if(c===true)S.writeChecked=true}}catch(e){}
})();
})();
</script>
