<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alimentos ChatiChef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Figtree:wght@700;800&display=swap">
<style>
/* VOICE: práctico y tranquilo, como una ficha de cocina; nada de jerga.
   IDEA: la ficha de alergias pegada en la nevera, con un cuestionario que se va tachando.
   PICTURE: la lista de preguntas pendientes es la propia pieza: tarjetas con respuestas grandes para tocar.
   COLOUR and TYPE: el verde de ChatiChef, rojo para «no puede», ámbar para «poca cantidad»; Figtree en títulos, Atkinson en el texto.
   LAYOUT: una columna de móvil, pestañas arriba, contador de pendientes. */
:root{color-scheme:light dark;
  --bg:light-dark(#F3F5F2,#111613);--card:light-dark(#FFFFFF,#1A211D);--sunk:light-dark(#E8ECE7,#232C27);--line:light-dark(#D3DAD3,#2F3A34);
  --ink:light-dark(#18201C,#E7EEE9);--muted:light-dark(#5C6A62,#9AAAA1);
  --acc:light-dark(#1F6B4A,#5FC193);--acc-ink:light-dark(#FFFFFF,#0D1A13);--acc-soft:light-dark(#DCEDE3,#1F3A2C);
  --warn:light-dark(#9A5B05,#F0B451);--warn-soft:light-dark(#FBEBCF,#3A2C12);
  --bad:light-dark(#A8322A,#F08A80);--bad-soft:light-dark(#F8DEDA,#3C1E1B)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1{font:800 1.9rem/1.05 Figtree,system-ui,sans-serif;margin:0;text-wrap:balance}
h2{font:700 1.15rem/1.2 Figtree,system-ui,sans-serif;margin:0}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.88rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:700;border-radius:9px}
.tabs button[aria-current=page]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
button{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{background:var(--sunk)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.chip.tu{background:var(--acc-soft);color:var(--acc)}
.q{font-weight:700;font-size:1.05rem;text-wrap:pretty}
.why{font-size:.88rem;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left}
.opts button[aria-pressed=true]{background:var(--acc-soft);border-color:var(--acc);color:var(--ink);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.progress{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .3s}
.answer{font-weight:700}
.person{display:flex;flex-direction:column;gap:10px}
.group{display:flex;flex-direction:column;gap:4px}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;border-left:5px solid var(--sc,var(--line));cursor:pointer;text-align:left;width:100%;min-height:0}
.food b{font-weight:700}.food span{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.s-no{--sc:var(--bad)}.s-poco{--sc:var(--warn)}.s-nogusta{--sc:var(--muted)}.s-si{--sc:var(--acc)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--sc);margin-right:5px}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:calc(100% - 32px)}
@media(prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Qué podemos comer</h1><p class="muted small" id="sub">Cargando…</p></header>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  <main id="view"><div class="empty">Cargando…</div></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
{
const PERS={tu:"Tú",pareja:"Tu pareja",dos:"Los dos"};
const EST=[["no","No puede tomarlo"],["poco","Solo en poca cantidad"],["nogusta","No le gusta"],["si","Sin problema"]];
const S={db:null,state:"loading",tab:"preguntas",qs:[],foods:[],draft:{},editing:null,busy:false};
try{const t=localStorage.getItem("alimentos-tab");if(t)S.tab=t}catch(e){}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>new Date().toISOString();
const $=id=>document.getElementById(id);
let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}

function pending(){return S.qs.filter(q=>q.estado!=="contestada").sort((a,b)=>(a.orden||0)-(b.orden||0))}
function answered(){return S.qs.filter(q=>q.estado==="contestada").sort((a,b)=>(b.contestadaAt||"").localeCompare(a.contestadaAt||""))}

function qCard(q,editing){
  const d=S.draft[q.id]||{r:q.respuesta||"",n:q.nota||""};S.draft[q.id]=d;
  let h='<article class="card'+(q.estado==="contestada"&&!editing?" done":"")+'"><div class="chips"><span class="chip'+(q.persona==="tu"?" tu":"")+'">'+esc(PERS[q.persona]||q.persona)+'</span>'+(q.tema?'<span class="chip">'+esc(q.tema)+'</span>':"")+'</div>';
  h+='<p class="q">'+esc(q.texto)+'</p>'+(q.porque?'<p class="why">'+esc(q.porque)+'</p>':"");
  if(q.estado==="contestada"&&!editing){
    h+='<p>Tu respuesta: <span class="answer">'+esc(q.respuesta||"—")+'</span></p>'+(q.nota?'<p class="small">'+esc(q.nota)+'</p>':"");
    h+='<div class="row"><button class="ghost" data-act="edit" data-id="'+esc(q.id)+'">Cambiar</button></div>';
    return h+'</article>';
  }
  const opts=Array.isArray(q.opciones)?q.opciones:[];
  if(opts.length)h+='<div class="opts" role="group" aria-label="Respuestas">'+opts.map(o=>'<button type="button" data-act="pick" data-id="'+esc(q.id)+'" data-v="'+esc(o)+'" aria-pressed="'+(d.r===o)+'">'+esc(o)+'</button>').join("")+'</div>';
  h+='<label class="small muted" for="n-'+esc(q.id)+'">'+(opts.length?"Algo más que deba saber (opcional)":"Tu respuesta")+'</label><textarea id="n-'+esc(q.id)+'" data-note="'+esc(q.id)+'" placeholder="'+(opts.length?"Por ejemplo: solo me pasa si…":"Escribe aquí")+'">'+esc(d.n)+'</textarea>';
  h+='<div class="row"><button class="primary" data-act="save" data-id="'+esc(q.id)+'">Guardar</button>'+(editing?'<button class="ghost" data-act="cancel">Cancelar</button>':"")+'</div>';
  return h+'</article>';
}

function viewPreguntas(){
  const p=pending(),a=answered(),total=S.qs.length;
  if(!total)return '<div class="empty">Todavía no hay preguntas. Claude las irá dejando aquí.</div>';
  let h='<div class="card"><div class="row" style="justify-content:space-between"><b>'+a.length+' de '+total+' contestadas</b><span class="small muted">'+(p.length?"Quedan "+p.length:"¡Todas contestadas!")+'</span></div><div class="progress"><i style="width:'+Math.round(a.length/total*100)+'%"></i></div><p class="small muted">Contesta las que sepas; puedes dejar las demás para luego. Claude lee las respuestas y actualiza las instrucciones de ChatiChef.</p></div>';
  h+=p.map(q=>qCard(q,false)).join("");
  if(a.length)h+='<h2 style="margin-top:8px">Contestadas</h2>'+a.map(q=>qCard(q,S.editing===q.id)).join("");
  return h;
}

function foodBtn(f){
  return '<button type="button" class="food s-'+esc(f.estado)+'" data-act="editFood" data-id="'+esc(f.id)+'"><b>'+esc(f.nombre)+'</b>'+(f.cantidad?'<em class="small">'+esc(f.cantidad)+'</em>':'<em></em>')+((f.nota)?'<span>'+esc(f.nota)+'</span>':"")+'</button>';
}
function foodForm(f){
  f=f||{nombre:"",persona:"tu",estado:"no",cantidad:"",nota:""};const isNew=!f.id;
  return '<form class="card form" id="foodForm" data-id="'+esc(f.id||"")+'"><h2 class="full">'+(isNew?"Añadir un alimento":"Cambiar «"+esc(f.nombre)+"»")+'</h2>'
   +'<label class="full">Alimento<input id="f-nombre" value="'+esc(f.nombre)+'" placeholder="Pimiento verde" required></label>'
   +'<label>Quién<select id="f-persona">'+Object.entries(PERS).map(([k,v])=>'<option value="'+k+'"'+(f.persona===k?" selected":"")+'>'+v+'</option>').join("")+'</select></label>'
   +'<label>Cómo<select id="f-estado">'+EST.map(([k,v])=>'<option value="'+k+'"'+(f.estado===k?" selected":"")+'>'+v+'</option>').join("")+'</select></label>'
   +'<label class="full">Cuánto, si es en poca cantidad<input id="f-cantidad" value="'+esc(f.cantidad||"")+'" placeholder="25–30 g por persona"></label>'
   +'<label class="full">Nota<input id="f-nota" value="'+esc(f.nota||"")+'" placeholder="Crudo no, cocinado sí"></label>'
   +'<div class="row full"><button class="primary" type="submit">'+(isNew?"Añadir":"Guardar")+'</button>'+(isNew?"":'<button type="button" class="ghost" data-act="cancelFood">Cancelar</button><button type="button" class="danger" data-act="delFood" data-id="'+esc(f.id)+'">Quitar</button>')+'</div></form>';
}
function viewAlimentos(){
  const ed=S.editing&&S.foods.find(f=>f.id===S.editing);
  let h=foodForm(ed);
  h+='<div class="legend">'+EST.map(([k,v])=>'<span class="s-'+k+'"><i></i>'+v+'</span>').join("")+'</div>';
  if(!S.foods.length)return h+'<div class="empty">Aún no hay alimentos apuntados.</div>';
  Object.entries(PERS).forEach(([p,label])=>{
    const list=S.foods.filter(f=>f.persona===p);if(!list.length)return;
    h+='<section class="person"><h2>'+label+'</h2>';
    EST.forEach(([k,v])=>{const g=list.filter(f=>f.estado===k).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));if(g.length)h+='<div class="group"><p class="small muted">'+v+'</p>'+g.map(foodBtn).join("")+'</div>'});
    h+='</section>';
  });
  return h;
}

function render(){
  const p=pending().length;
  $("tabs").innerHTML=[["preguntas","Preguntas"+(p?" ("+p+")":"")],["alimentos","Alimentos"]].map(([k,l])=>'<button type="button" data-act="tab" data-tab="'+k+'"'+(S.tab===k?' aria-current="page"':"")+'>'+l+'</button>').join("");
  $("sub").textContent=S.state==="ready"?"Lo que puede y no puede comer cada uno. ChatiChef lo aplica en cada menú.":(S.state==="offline"?"":"Cargando…");
  const v=$("view");
  if(S.state==="loading"){v.innerHTML='<div class="empty">Cargando…</div>';return}
  if(S.state==="offline"){v.innerHTML='<div class="empty">No se pueden cargar los datos. Ábrelo con tu sesión de Claude iniciada.</div>';return}
  v.innerHTML='<div style="display:flex;flex-direction:column;gap:12px">'+(S.tab==="preguntas"?viewPreguntas():viewAlimentos())+'</div>';
}
let deferred=false;
function schedule(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){deferred=true;return}render()}
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;if(deferred&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){deferred=false;render()}},60));

async function w(fn,ok){if(!S.db||S.busy)return false;S.busy=true;try{await fn();if(ok)toast(ok);return true}catch(e){toast(e&&e.code==="invalid_argument"?"No tienes permiso para cambiarlo.":"No se ha podido guardar. Prueba otra vez.");return false}finally{S.busy=false}}

document.addEventListener("input",e=>{const id=e.target.dataset&&e.target.dataset.note;if(id){(S.draft[id]=S.draft[id]||{r:"",n:""}).n=e.target.value}});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="tab"){S.tab=b.dataset.tab;S.editing=null;try{localStorage.setItem("alimentos-tab",S.tab)}catch(_){}render();return}
  if(a==="pick"){const d=S.draft[id]||(S.draft[id]={r:"",n:""});d.r=d.r===b.dataset.v?"":b.dataset.v;b.closest(".opts").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===d.r)));return}
  if(a==="edit"){S.editing=id;render();return}
  if(a==="cancel"||a==="cancelFood"){S.editing=null;render();return}
  if(a==="save"){const q=S.qs.find(x=>x.id===id);const d=S.draft[id]||{r:"",n:""};const hasOpts=Array.isArray(q.opciones)&&q.opciones.length;
    if(hasOpts?!d.r:!d.n.trim()){toast(hasOpts?"Elige una respuesta.":"Escribe tu respuesta.");return}
    if(await w(()=>S.db.doc("preguntas/"+id).update({respuesta:hasOpts?d.r:d.n.trim(),nota:hasOpts?d.n.trim():"",estado:"contestada",contestadaAt:now()}),"Guardado.")){S.editing=null;delete S.draft[id]}return}
  if(a==="editFood"){S.editing=id;render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(a==="delFood"){if(await w(()=>S.db.doc("alimentos/"+id).delete(),"Quitado."))S.editing=null;return}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="foodForm")return;e.preventDefault();
  const nombre=$("f-nombre").value.trim();if(!nombre){toast("Escribe el alimento.");return}
  const data={nombre,persona:$("f-persona").value,estado:$("f-estado").value,cantidad:$("f-cantidad").value.trim(),nota:$("f-nota").value.trim(),updatedAt:now()};
  const id=e.target.dataset.id;
  const ref=id?S.db.doc("alimentos/"+id):S.db.collection("alimentos").doc();
  if(await w(()=>id?ref.update(data):ref.set(data),id?"Guardado.":"Añadido."))S.editing=null;
});

render();
(async()=>{
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){}
  if(!db){S.state="offline";render();return}
  S.db=db;const got={q:0,f:0};const timer=setTimeout(()=>{if(S.state==="loading"){S.state="ready";render()}},10000);
  const ready=k=>{got[k]=1;if(got.q&&got.f){S.state="ready";clearTimeout(timer)}schedule()};
  db.collection("preguntas").onSnapshot(s=>{S.qs=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready("q")},()=>ready("q"));
  db.collection("alimentos").onSnapshot(s=>{S.foods=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready("f")},()=>ready("f"));
})();
}
</script>
</body>
</html>
