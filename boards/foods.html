<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChatiChef foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Figtree:wght@700;800&display=swap">
<style>
/* VOICE: practical and calm, like a kitchen card; no jargon.
   IDEA: the allergy sheet stuck on the fridge, with a questionnaire that gets ticked off.
   PICTURE: the list of pending questions is the piece itself: cards with big answers to tap.
   COLOUR and TYPE: ChatiChef green, red for «can't have it», amber for «only a little»; Figtree for titles, Atkinson for text.
   LAYOUT: one mobile column, tabs on top, pending counter. */
:root{color-scheme:light dark;
  --bg:light-dark(#F3F5F2,#111613);--card:light-dark(#FFFFFF,#1A211D);--sunk:light-dark(#E8ECE7,#232C27);--line:light-dark(#D3DAD3,#2F3A34);
  --ink:light-dark(#18201C,#E7EEE9);--muted:light-dark(#5C6A62,#9AAAA1);
  --acc:light-dark(#1F6B4A,#5FC193);--acc-ink:light-dark(#FFFFFF,#0D1A13);--acc-soft:light-dark(#DCEDE3,#1F3A2C);
  --warn:light-dark(#9A5B05,#F0B451);--warn-soft:light-dark(#FBEBCF,#3A2C12);
  --bad:light-dark(#A8322A,#F08A80);--bad-soft:light-dark(#F8DEDA,#3C1E1B)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1{font:800 1.9rem/1.05 Figtree,system-ui,sans-serif;margin:0;text-wrap:balance}
h2{font:700 1.15rem/1.2 Figtree,system-ui,sans-serif;margin:0}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.88rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:700;border-radius:9px}
.tabs button[aria-current=page]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
button{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{background:var(--sunk)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.chip.tu{background:var(--acc-soft);color:var(--acc)}
.q{font-weight:700;font-size:1.05rem;text-wrap:pretty}
.why{font-size:.88rem;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left}
.opts button[aria-pressed=true]{background:var(--acc-soft);border-color:var(--acc);color:var(--ink);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.progress{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .3s}
.answer{font-weight:700}
.person{display:flex;flex-direction:column;gap:10px}
.group{display:flex;flex-direction:column;gap:4px}
.food{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;border-left:5px solid var(--sc,var(--line));cursor:pointer;text-align:left;width:100%;min-height:0}
.food b{font-weight:700}.food span{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.s-no{--sc:var(--bad)}.s-little{--sc:var(--warn)}.s-dislike{--sc:var(--muted)}.s-yes{--sc:var(--acc)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--sc);margin-right:5px}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:calc(100% - 32px)}
@media(prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title"></h1><p class="muted small" id="sub"></p></header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"><div class="empty" id="loading"></div></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
{
/* Language: Spanish if the phone is in Spanish, English otherwise. Questions and food names are data:
   they are shown as Claude or you wrote them. */
const LANG=((navigator.languages&&navigator.languages[0])||navigator.language||"en").toLowerCase().startsWith("es")?"es":"en";
const LOCALE=LANG==="es"?"es-ES":"en-GB";
document.documentElement.lang=LANG;
const ES={
"What we can eat":"Qué podemos comer","Loading…":"Cargando…","Sections":"Secciones","Questions":"Preguntas","Foods":"Alimentos",
"What each of you can and can't eat. ChatiChef applies it to every menu.":"Lo que puede y no puede comer cada uno. ChatiChef lo aplica en cada menú.",
"The data can't be loaded. Open it with your Claude account signed in.":"No se pueden cargar los datos. Ábrelo con tu sesión de Claude iniciada.",
"You":"Tú","Your partner":"Tu pareja","Both":"Los dos",
"Can't have it":"No puede tomarlo","Only a little":"Solo en poca cantidad","Doesn't like it":"No le gusta","No problem":"Sin problema",
"Your answer:":"Tu respuesta:","Change":"Cambiar","Answers":"Respuestas","Anything else I should know (optional)":"Algo más que deba saber (opcional)",
"Your answer":"Tu respuesta","For example: only if…":"Por ejemplo: solo me pasa si…","Write here":"Escribe aquí","Save":"Guardar","Cancel":"Cancelar",
"No questions yet. Claude will leave them here.":"Todavía no hay preguntas. Claude las irá dejando aquí.",
"{a} of {t} answered":"{a} de {t} contestadas","{n} left":"Quedan {n}","All answered!":"¡Todas contestadas!",
"Answer the ones you know; you can leave the rest for later. Claude reads the answers and updates the ChatiChef instructions.":"Contesta las que sepas; puedes dejar las demás para luego. Claude lee las respuestas y actualiza las instrucciones de ChatiChef.",
"Answered":"Contestadas","Add a food":"Añadir un alimento","Change «{n}»":"Cambiar «{n}»","Food":"Alimento","Green pepper":"Pimiento verde","Who":"Quién","How":"Cómo",
"How much, if only a little":"Cuánto, si es en poca cantidad","25–30 g per person":"25–30 g por persona","Note":"Nota","Raw no, cooked yes":"Crudo no, cocinado sí",
"Add":"Añadir","Remove":"Quitar","No foods noted yet.":"Aún no hay alimentos apuntados.",
"You don't have permission to change it.":"No tienes permiso para cambiarlo.","Couldn't save. Try again.":"No se ha podido guardar. Prueba otra vez.",
"Pick an answer.":"Elige una respuesta.","Write your answer.":"Escribe tu respuesta.","Saved.":"Guardado.","Removed.":"Quitado.","Write the food.":"Escribe el alimento.","Added.":"Añadido."
};
const t=s=>LANG==="es"&&ES[s]!=null?ES[s]:s;
const tf=(s,v)=>t(s).replace(/\{(\w+)\}/g,(_,k)=>v[k]==null?"":v[k]);
const PERSON={me:"You",partner:"Your partner",both:"Both"};
const STATUS=[["no","Can't have it"],["little","Only a little"],["dislike","Doesn't like it"],["yes","No problem"]];
const S={db:null,state:"loading",tab:"questions",qs:[],foods:[],draft:{},editing:null,busy:false};
try{const x=localStorage.getItem("chatichef-foods-tab");if(x==="questions"||x==="foods")S.tab=x}catch(e){}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>new Date().toISOString();
const $=id=>document.getElementById(id);
$("title").textContent=t("What we can eat");$("tabs").setAttribute("aria-label",t("Sections"));$("loading").textContent=t("Loading…");document.title=LANG==="es"?"Alimentos ChatiChef":"ChatiChef foods";
let tt;function toast(m){const x=$("toast");x.textContent=m;x.hidden=false;clearTimeout(tt);tt=setTimeout(()=>x.hidden=true,3000)}

function pending(){return S.qs.filter(q=>q.status!=="answered").sort((a,b)=>(a.order||0)-(b.order||0))}
function answered(){return S.qs.filter(q=>q.status==="answered").sort((a,b)=>(b.answeredAt||"").localeCompare(a.answeredAt||""))}

function qCard(q,editing){
  const d=S.draft[q.id]||{r:q.answer||"",n:q.note||""};S.draft[q.id]=d;
  let h='<article class="card'+(q.status==="answered"&&!editing?" done":"")+'"><div class="chips"><span class="chip'+(q.person==="me"?" tu":"")+'">'+esc(t(PERSON[q.person]||q.person))+'</span>'+(q.topic?'<span class="chip">'+esc(q.topic)+'</span>':"")+'</div>';
  h+='<p class="q">'+esc(q.text)+'</p>'+(q.why?'<p class="why">'+esc(q.why)+'</p>':"");
  if(q.status==="answered"&&!editing){
    h+='<p>'+esc(t("Your answer:"))+' <span class="answer">'+esc(q.answer||"—")+'</span></p>'+(q.note?'<p class="small">'+esc(q.note)+'</p>':"");
    h+='<div class="row"><button class="ghost" data-act="edit" data-id="'+esc(q.id)+'">'+esc(t("Change"))+'</button></div>';
    return h+'</article>';
  }
  const opts=Array.isArray(q.options)?q.options:[];
  if(opts.length)h+='<div class="opts" role="group" aria-label="'+esc(t("Answers"))+'">'+opts.map(o=>'<button type="button" data-act="pick" data-id="'+esc(q.id)+'" data-v="'+esc(o)+'" aria-pressed="'+(d.r===o)+'">'+esc(o)+'</button>').join("")+'</div>';
  h+='<label class="small muted" for="n-'+esc(q.id)+'">'+esc(t(opts.length?"Anything else I should know (optional)":"Your answer"))+'</label><textarea id="n-'+esc(q.id)+'" data-note="'+esc(q.id)+'" placeholder="'+esc(t(opts.length?"For example: only if…":"Write here"))+'">'+esc(d.n)+'</textarea>';
  h+='<div class="row"><button class="primary" data-act="save" data-id="'+esc(q.id)+'">'+esc(t("Save"))+'</button>'+(editing?'<button class="ghost" data-act="cancel">'+esc(t("Cancel"))+'</button>':"")+'</div>';
  return h+'</article>';
}

function viewQuestions(){
  const p=pending(),a=answered(),total=S.qs.length;
  if(!total)return '<div class="empty">'+esc(t("No questions yet. Claude will leave them here."))+'</div>';
  let h='<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(tf("{a} of {t} answered",{a:a.length,t:total}))+'</b><span class="small muted">'+esc(p.length?tf("{n} left",{n:p.length}):t("All answered!"))+'</span></div><div class="progress"><i style="width:'+Math.round(a.length/total*100)+'%"></i></div><p class="small muted">'+esc(t("Answer the ones you know; you can leave the rest for later. Claude reads the answers and updates the ChatiChef instructions."))+'</p></div>';
  h+=p.map(q=>qCard(q,false)).join("");
  if(a.length)h+='<h2 style="margin-top:8px">'+esc(t("Answered"))+'</h2>'+a.map(q=>qCard(q,S.editing===q.id)).join("");
  return h;
}

function foodBtn(f){
  return '<button type="button" class="food s-'+esc(f.status)+'" data-act="editFood" data-id="'+esc(f.id)+'"><b>'+esc(f.name)+'</b>'+(f.amount?'<em class="small">'+esc(f.amount)+'</em>':'<em></em>')+(f.note?'<span>'+esc(f.note)+'</span>':"")+'</button>';
}
function foodForm(f){
  f=f||{name:"",person:"me",status:"no",amount:"",note:""};const isNew=!f.id;
  return '<form class="card form" id="foodForm" data-id="'+esc(f.id||"")+'"><h2 class="full">'+esc(isNew?t("Add a food"):tf("Change «{n}»",{n:f.name}))+'</h2>'
   +'<label class="full">'+esc(t("Food"))+'<input id="f-name" value="'+esc(f.name)+'" placeholder="'+esc(t("Green pepper"))+'" required></label>'
   +'<label>'+esc(t("Who"))+'<select id="f-person">'+Object.entries(PERSON).map(([k,v])=>'<option value="'+k+'"'+(f.person===k?" selected":"")+'>'+esc(t(v))+'</option>').join("")+'</select></label>'
   +'<label>'+esc(t("How"))+'<select id="f-status">'+STATUS.map(([k,v])=>'<option value="'+k+'"'+(f.status===k?" selected":"")+'>'+esc(t(v))+'</option>').join("")+'</select></label>'
   +'<label class="full">'+esc(t("How much, if only a little"))+'<input id="f-amount" value="'+esc(f.amount||"")+'" placeholder="'+esc(t("25–30 g per person"))+'"></label>'
   +'<label class="full">'+esc(t("Note"))+'<input id="f-note" value="'+esc(f.note||"")+'" placeholder="'+esc(t("Raw no, cooked yes"))+'"></label>'
   +'<div class="row full"><button class="primary" type="submit">'+esc(t(isNew?"Add":"Save"))+'</button>'+(isNew?"":'<button type="button" class="ghost" data-act="cancelFood">'+esc(t("Cancel"))+'</button><button type="button" class="danger" data-act="delFood" data-id="'+esc(f.id)+'">'+esc(t("Remove"))+'</button>')+'</div></form>';
}
function viewFoods(){
  const ed=S.editing&&S.foods.find(f=>f.id===S.editing);
  let h=foodForm(ed);
  h+='<div class="legend">'+STATUS.map(([k,v])=>'<span class="s-'+k+'"><i></i>'+esc(t(v))+'</span>').join("")+'</div>';
  if(!S.foods.length)return h+'<div class="empty">'+esc(t("No foods noted yet."))+'</div>';
  Object.entries(PERSON).forEach(([p,label])=>{
    const list=S.foods.filter(f=>f.person===p);if(!list.length)return;
    h+='<section class="person"><h2>'+esc(t(label))+'</h2>';
    STATUS.forEach(([k,v])=>{const g=list.filter(f=>f.status===k).sort((a,b)=>String(a.name).localeCompare(String(b.name),LOCALE));if(g.length)h+='<div class="group"><p class="small muted">'+esc(t(v))+'</p>'+g.map(foodBtn).join("")+'</div>'});
    h+='</section>';
  });
  return h;
}

function render(){
  const p=pending().length;
  $("tabs").innerHTML=[["questions",t("Questions")+(p?" ("+p+")":"")],["foods",t("Foods")]].map(([k,l])=>'<button type="button" data-act="tab" data-tab="'+k+'"'+(S.tab===k?' aria-current="page"':"")+'>'+esc(l)+'</button>').join("");
  $("sub").textContent=S.state==="ready"?t("What each of you can and can't eat. ChatiChef applies it to every menu."):(S.state==="offline"?"":t("Loading…"));
  const v=$("view");
  if(S.state==="loading"){v.innerHTML='<div class="empty">'+esc(t("Loading…"))+'</div>';return}
  if(S.state==="offline"){v.innerHTML='<div class="empty">'+esc(t("The data can't be loaded. Open it with your Claude account signed in."))+'</div>';return}
  v.innerHTML='<div style="display:flex;flex-direction:column;gap:12px">'+(S.tab==="questions"?viewQuestions():viewFoods())+'</div>';
}
let deferred=false;
function schedule(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){deferred=true;return}render()}
document.addEventListener("focusout",()=>setTimeout(()=>{const a=document.activeElement;if(deferred&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){deferred=false;render()}},60));

async function w(fn,ok){if(!S.db||S.busy)return false;S.busy=true;try{await fn();if(ok)toast(t(ok));return true}catch(e){toast(t(e&&e.code==="invalid_argument"?"You don't have permission to change it.":"Couldn't save. Try again."));return false}finally{S.busy=false}}

document.addEventListener("input",e=>{const id=e.target.dataset&&e.target.dataset.note;if(id){(S.draft[id]=S.draft[id]||{r:"",n:""}).n=e.target.value}});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="tab"){S.tab=b.dataset.tab;S.editing=null;try{localStorage.setItem("chatichef-foods-tab",S.tab)}catch(_){}render();return}
  if(a==="pick"){const d=S.draft[id]||(S.draft[id]={r:"",n:""});d.r=d.r===b.dataset.v?"":b.dataset.v;b.closest(".opts").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===d.r)));return}
  if(a==="edit"){S.editing=id;render();return}
  if(a==="cancel"||a==="cancelFood"){S.editing=null;render();return}
  if(a==="save"){const q=S.qs.find(x=>x.id===id);const d=S.draft[id]||{r:"",n:""};const hasOpts=Array.isArray(q.options)&&q.options.length;
    if(hasOpts?!d.r:!d.n.trim()){toast(t(hasOpts?"Pick an answer.":"Write your answer."));return}
    if(await w(()=>S.db.doc("questions/"+id).update({answer:hasOpts?d.r:d.n.trim(),note:hasOpts?d.n.trim():"",status:"answered",answeredAt:now()}),"Saved.")){S.editing=null;delete S.draft[id]}return}
  if(a==="editFood"){S.editing=id;render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(a==="delFood"){if(await w(()=>S.db.doc("foods/"+id).delete(),"Removed."))S.editing=null;return}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="foodForm")return;e.preventDefault();
  const name=$("f-name").value.trim();if(!name){toast(t("Write the food."));return}
  const data={name,person:$("f-person").value,status:$("f-status").value,amount:$("f-amount").value.trim(),note:$("f-note").value.trim(),updatedAt:now()};
  const id=e.target.dataset.id;
  const ref=id?S.db.doc("foods/"+id):S.db.collection("foods").doc();
  if(await w(()=>id?ref.update(data):ref.set(data),id?"Saved.":"Added."))S.editing=null;
});

render();
(async()=>{
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){}
  if(!db){S.state="offline";render();return}
  S.db=db;const got={q:0,f:0};const timer=setTimeout(()=>{if(S.state==="loading"){S.state="ready";render()}},10000);
  const ready=k=>{got[k]=1;if(got.q&&got.f){S.state="ready";clearTimeout(timer)}schedule()};
  db.collection("questions").onSnapshot(s=>{S.qs=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready("q")},()=>ready("q"));
  db.collection("foods").onSnapshot(s=>{S.foods=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready("f")},()=>ready("f"));
})();
}
</script>
</body>
</html>
