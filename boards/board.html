<style>
/* Layout: one mobile column (max 680px) with a fixed tab bar at the bottom; one collapsible card per dish. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E8ECE7; --line:#D3DAD3;
  --fg:#18201C; --muted:#5C6A62;
  --accent:#1F6B4A; --accent-ink:#FFFFFF; --accent-soft:#DCEDE3;
  --warn:#9A5B05; --warn-soft:#FBEBCF;
  --bad:#A8322A; --bad-soft:#F8DEDA;
  --star:#C98A0B;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1A211D; --sunk:#232C27; --line:#2F3A34;
  --fg:#E7EEE9; --muted:#9AAAA1;
  --accent:#5FC193; --accent-ink:#0D1A13; --accent-soft:#1F3A2C;
  --warn:#F0B451; --warn-soft:#3A2C12;
  --bad:#F08A80; --bad-soft:#3C1E1B;
  --star:#F0B451; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A211D; --sunk:#232C27; --line:#2F3A34;
  --fg:#E7EEE9; --muted:#9AAAA1;
  --accent:#5FC193; --accent-ink:#0D1A13; --accent-soft:#1F3A2C;
  --warn:#F0B451; --warn-soft:#3A2C12;
  --bad:#F08A80; --bad-soft:#3C1E1B;
  --star:#F0B451; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--f-display);font-size:1.6rem;margin:0;letter-spacing:-.01em}
header.top .wk{color:var(--muted);font-size:.9rem}
.upd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);margin-top:4px}
.upd:empty{display:none}
.upd b{font-weight:600;color:var(--fg)}
.upd .stale{color:var(--warn);font-weight:600}
h2{font-family:var(--f-display);font-size:1.2rem;margin:0;text-wrap:balance}
h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.section{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;min-height:40px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:40px}
textarea{width:100%;min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.notice{border-radius:var(--r);padding:12px 14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.notice.warn{background:var(--warn-soft);border-color:transparent}
.notice.bad{background:var(--bad-soft);border-color:transparent}
.notice ul{margin:0;padding-left:18px}
.empty{padding:22px 16px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

/* Dishes */
details.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.meal.done{background:var(--sunk)}
details.meal>summary{list-style:none;padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
details.meal>summary::-webkit-details-marker{display:none}
.slotline{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.mtitle{font-family:var(--f-display);font-weight:600;font-size:1.08rem;line-height:1.25;text-wrap:balance}
details.meal.done .mtitle{text-decoration:line-through;text-decoration-thickness:1px;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.mbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:12px}
.origin{font-style:italic;color:var(--muted)}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.times div{background:var(--sunk);border-radius:8px;padding:6px 8px}
.times b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.times span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
ul.ings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ul.ings label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
ul.ings input[type=checkbox]{width:20px;height:20px;min-height:0;margin-top:2px;accent-color:var(--accent);flex:none}
ul.ings input:checked + span{color:var(--muted);text-decoration:line-through}
.from{font-size:.72rem;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px;margin-left:4px;white-space:nowrap}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.notes{display:flex;flex-direction:column;gap:8px}
.notes p{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.usedrow{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center}
.usedrow input{width:100%}
.stars{display:flex;gap:2px}
.stars button{border:none;background:none;font-size:1.6rem;line-height:1;color:var(--line);padding:4px;min-height:0}
.stars button.on{color:var(--star)}
.daygroup{display:flex;flex-direction:column;gap:8px}
.dayhead{display:flex;align-items:baseline;gap:8px}
.dayhead.today h2{color:var(--accent)}
.wswitch{display:flex;gap:6px;flex-wrap:wrap}
.wswitch button{flex:1;min-width:0;font-weight:600}
.wswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wpick{display:flex;gap:6px;align-items:center}
.wpick select{flex:1;min-width:0;font-weight:700;appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.wpick button{min-width:44px;padding:6px 0;font-size:1.1rem;line-height:1}
.rs .wpick select,.rs .wpick button{min-height:0;padding-top:.35em;padding-bottom:.35em;font-size:.95em}
.rs .wpick select{padding-left:.6em}
/* Summary: the whole week on one phone screen, without scrolling */
body.fit .wrap{height:100vh;height:100dvh;padding-block:10px calc(66px + env(safe-area-inset-bottom,0px));gap:6px;overflow:hidden}
body.fit .upd{display:none}
body.fit header.top h1{font-size:1.3rem}
body.fit main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
body.fit main>.section{flex:1 1 auto;min-height:0}
.rs{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.45em;font-size:clamp(10.5px,min(3.3vw,1.85vh),15px);line-height:1.18}
.rs .wswitch button{min-height:0;padding:.35em .5em;font-size:.95em}
.rs-list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
button.rs-row{flex:1 1 0;min-height:0;width:100%;display:grid;grid-template-columns:3.1em minmax(0,1fr) 3.4em 3.9em;gap:.5em;align-items:center;text-align:left;font:inherit;color:inherit;background:transparent;border:0;border-radius:0;border-left:4px solid var(--pc,var(--line));border-top:1px solid var(--line);padding:.15em .6em;cursor:pointer}
button.rs-row:first-child{border-top:0}
button.rs-row.same{border-top-style:dashed}
.rs-row.same .rs-day b{visibility:hidden}
.rs-row.today{background:var(--accent-soft)}
.rs-row.done .rs-dish{text-decoration:line-through;color:var(--muted)}
.rs-day{display:flex;flex-direction:column;line-height:1.1}
.rs-day b{font-family:var(--f-display);font-size:1.15em}
.rs-day span,.rs-n span,.rs-dish small{font-size:.8em;color:var(--muted);font-weight:400}
.rs-dish{font-weight:700;min-width:0}
.rs-dish small{display:block}
.rs-n{text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.rs-n span{display:block}
.rs-tag{font-size:.75em;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:0 .45em;margin-left:.25em;white-space:nowrap}
.p-meat{--pc:#C2603A}.p-fish{--pc:#3A82B5}.p-egg{--pc:#D29A1F}.p-legume{--pc:#7D8C30}
.rs-postres{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:.45em}
button.rs-postre{min-height:0;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.4em .6em;display:flex;flex-direction:column;gap:.1em;cursor:pointer}
.rs-postre .cap{font-size:.72em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rs-postre .sub{font-size:.85em;color:var(--muted);font-variant-numeric:tabular-nums}
.rs-foot{flex:none;display:flex;flex-direction:column;gap:.25em;font-size:.8em;color:var(--muted)}
.rs-legend{display:flex;flex-wrap:wrap;gap:.2em .8em}
.rs-legend i{display:inline-block;width:.75em;height:.75em;border-radius:2px;background:var(--pc);margin-right:.3em;vertical-align:-.05em}

/* Pantry */
.invgroup{display:flex;flex-direction:column;gap:6px}
.places{display:flex;flex-direction:column;gap:12px}
details.place{border-radius:var(--r);background:var(--sunk);border:1px solid var(--line)}
details.place>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:14px 14px}
details.place>summary::-webkit-details-marker{display:none}
.pname{font-family:var(--f-display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;min-width:0}
.pname::before{content:"";width:9px;height:9px;flex:none;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.place[open]>summary .pname::before{transform:rotate(45deg)}
details.place[open]>summary{border-bottom:1px solid var(--line)}
.pcount{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.psub{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.psub:empty{display:none}
.pbody{padding:12px;display:flex;flex-direction:column;gap:6px}
.pbody .empty{padding:14px 12px}
details.place.gone{background:transparent;border-style:dashed}
details.place.gone .pname{font-size:1rem;color:var(--muted)}
button.clr{align-self:flex-start;min-height:32px;padding:2px 8px;font-size:.82rem;color:var(--muted);border-color:transparent;text-decoration:underline;text-underline-offset:2px}
details.inv{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.inv>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;cursor:pointer;align-items:center}
details.inv>summary::-webkit-details-marker{display:none}
.iname{font-weight:700;min-width:0}
.iqty{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.iqty.unknown{color:var(--warn)}
.isub{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.iedit{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 input,.grid2 select{width:100%}
.moves{font-size:.82rem;color:var(--muted);margin:0;padding-left:18px}

/* Shopping */
.shopsec{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.counter{font-family:var(--f-display);font-size:1.05rem}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;width:100%;max-width:680px}
nav.tabs button{border:none;background:none;border-radius:8px;font-size:.76rem;padding:8px 2px;color:var(--muted);min-height:44px}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:.7rem;margin-left:3px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center;z-index:9;max-width:calc(100% - 32px)}
.toast button{background:transparent;color:var(--bg);border-color:var(--bg);min-height:34px;padding:4px 10px}
@media (prefers-reduced-motion:no-preference){details[open]>.mbody,details[open]>.iedit{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}
</style>

/* ---------- Dates and formatting ---------- */
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(iso,n){const [y,m,d]=iso.split("-").map(Number);const x=new Date(Date.UTC(y,m-1,d+n));return x.toISOString().slice(0,10)}
function diffDays(a,b){const p=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(a)-p(b))/864e5)}
function weekday(iso){const [y,m,d]=iso.split("-").map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
function dayName(iso){return DAYS[weekday(iso)]}
function fmtDate(iso){if(!iso)return"";const [y,m,d]=iso.split("-").map(Number);return d+" "+MONTHS[m-1]}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtQty(q,u){if(q==null)return LANG==="es"?"¿cantidad?":"amount?";const n=Math.round(q*10)/10;return n.toLocaleString(LOCALE)+(u?" "+u:"")}
function placeName(p){const f=PLACES.find(x=>x[0]===p);return t(f?f[1]:"Pantry 1")}
function slotName(s){return t(s||"")}

/* ---------- Derived data ---------- */
function week(){return S.cfg&&S.cfg.week}
/* Visible weeks: config/current.weeks (e.g. ["2026-11-16","2026-11-23"]) plus config/current.week. Today looks at all of them. */
function weeks(){if(!S.cfg)return[];const l=(Array.isArray(S.cfg.weeks)?S.cfg.weeks:[]).concat(S.cfg.week?[S.cfg.week]:[]);return [...new Set(l.filter(Boolean))].sort()}
function weekMeals(w){w=w||week();return S.meals.filter(m=>m.week===w)}
function liveMeals(){const ws=weeks();return S.meals.filter(m=>ws.includes(m.week))}
function weekOfDate(iso){const ws=weeks();if(!ws.length)return null;const hit=ws.filter(w=>{const d=diffDays(iso,w);return d>=0&&d<=6});if(hit.length)return hit[hit.length-1];if(iso<ws[0])return ws[0];return ws[ws.length-1]}
/* Every week with saved dishes (for the Week and Summary pickers), newest first */
function allWeeks(){return [...new Set(S.meals.map(m=>m.week).filter(Boolean).concat(weeks()))].sort().reverse()}
const PICK_VIEWS=["week","summary"];
function selWeek(view){const ws=PICK_VIEWS.includes(view)?allWeeks():weeks();const cur=S.sel[view];if(cur&&ws.includes(cur))return cur;return view==="shopping"?weeks()[weeks().length-1]:weekOfDate(todayISO())}
function weekPick(view){
  const ws=allWeeks();if(!ws.length)return"";const sw=selWeek(view);const live=weeks();const i=ws.indexOf(sw);
  const opt=w=>{const n=S.meals.filter(m=>m.week===w).length;const tag=w===(S.cfg&&S.cfg.week)?" "+t("· this week"):(live.includes(w)?"":(w>(S.cfg&&S.cfg.week||"")?" "+t("· next"):""));
    return '<option value="'+w+'"'+(w===sw?" selected":"")+'>'+esc(tf("Week of {d}",{d:fmtDate(w)}))+esc(tag)+' · '+esc(plural(n,"{n} recipe","{n} recipes"))+'</option>'};
  let h='<div class="wpick"><button type="button" data-act="stepWeek" data-view="'+view+'" data-week="'+(ws[i+1]||"")+'" aria-label="'+esc(t("Previous week"))+'"'+(ws[i+1]?"":" disabled")+'>‹</button>';
  h+='<select data-weekpick="'+view+'" aria-label="'+esc(t("Choose week"))+'">'+ws.map(opt).join("")+'</select>';
  h+='<button type="button" data-act="stepWeek" data-view="'+view+'" data-week="'+(ws[i-1]||"")+'" aria-label="'+esc(t("Next week"))+'"'+(ws[i-1]?"":" disabled")+'>›</button></div>';
  return h}
function isPast(w){return !weeks().includes(w)&&w<(S.cfg&&S.cfg.week||"")}
function weekSwitch(view){const ws=weeks();if(ws.length<2)return"";const sw=selWeek(view);return '<div class="wswitch" role="group" aria-label="'+esc(t("Week"))+'">'+ws.map(w=>'<button type="button" data-act="selWeek" data-view="'+view+'" data-week="'+w+'" aria-pressed="'+(w===sw)+'">'+esc(tf("Week of {d}",{d:fmtDate(w)}))+'</button>').join("")+'</div>'}
const SLOT_ORDER={lunch:0,dinner:1,dessert:2};
function sortMeals(a,b){return (a.date||"9").localeCompare(b.date||"9")||(SLOT_ORDER[a.slot]??3)-(SLOT_ORDER[b.slot]??3)||(a.order||0)-(b.order||0)}
function invById(id){return S.inv.find(i=>i.id===id)}
/* Expiry: in the freezer a past date only matters after 2 months */
function expiry(item){
  if(!item.expires)return null;const d=diffDays(item.expires,todayISO());
  if(item.place==="freezer"){
    if(d>=0)return{cls:"",txt:tf("Until {d}",{d:fmtDate(item.expires)})};
    if(-d>60)return{cls:"warn",frozen:true,txt:tf("Date passed {n} months ago: check it",{n:Math.floor(-d/30)})};
    return{cls:"",frozen:true,txt:t("Date passed · frozen, no problem")};
  }
  if(d<0)return{cls:"bad",txt:t("Expired")};if(d===0)return{cls:"bad",txt:t("Expires today")};
  if(d===1)return{cls:"warn",txt:t("Expires tomorrow")};if(d<=3)return{cls:"warn",txt:tf("Expires in {n} days",{n:d})};
  return{cls:"",txt:tf("Until {d}",{d:fmtDate(item.expires)})};
}

document.addEventListener("focusout",()=>{if(pending)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest("#view")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=="checkbox")){pending=false;render()}},50)});

let toastTimer;
function toast(msg,undo){const el=document.getElementById("toast");el.innerHTML="<span>"+esc(msg)+"</span>"+(undo?'<button type="button" id="undoBtn">'+esc(t("Undo"))+'</button>':"");el.hidden=false;clearTimeout(toastTimer);
  if(undo)document.getElementById("undoBtn").onclick=async()=>{el.hidden=true;await undo()};

async function w(fn,errMsg){if(!S.db||!S.canWrite)return false;S.busy=true;try{await fn();return true}catch(e){
  const c=e&&e.code;if(c==="invalid_argument"&&!S.writeChecked){S.canWrite=false;render();toast(t("This link is read-only for you."))}
  else if(c==="quota_exceeded")toast(t("The database is full: delete old dishes."));
  else toast(errMsg||t("Couldn't save. Try again."));return false}finally{S.busy=false}}

function mealCard(m,opts){
  opts=opts||{};const key="m:"+m.id;const isOpen=open.has(key)||opts.forceOpen;
  const done=m.status==="done";
  const tm=m.times||{};
  const tag={quick:["ok","Quick"],medium:["","Medium"],long:["warn","Long"]}[m.tag];
  const who=m.for?" · "+esc(m.for):"";
  let h='<details class="meal'+(done?" done":"")+'" data-key="'+key+'"'+(isOpen?" open":"")+'><summary>';
  h+='<div class="slotline"><span>'+esc(cap(slotName(m.slot)))+who+'</span>'+(m.movedFrom?'<span>'+esc(tf("moved from {d}",{d:dayName(m.movedFrom)}))+'</span>':"")+'</div>';
  h+='<div class="mtitle">'+esc(m.title)+'</div><div class="meta">';
  if(done)h+='<span class="chip ok">'+esc(t("Done"))+'</span>';
  if(m.rating)h+='<span class="chip" aria-label="'+esc(tf("{n} of 5",{n:m.rating}))+'">'+"★".repeat(m.rating)+'</span>';
  if(tag)h+='<span class="chip '+tag[0]+'">'+esc(t(tag[1]))+'</span>';
  if(tm.knife!=null)h+='<span class="chip num">'+esc(tf("Knife {n} min",{n:tm.knife}))+'</span>';
  if(tm.total!=null)h+='<span class="chip num">'+esc(tf("Total {n} min",{n:tm.total}))+'</span>';
  if(m.kcal)h+='<span class="chip num">'+esc(tf("{k} kcal · {p} g prot",{k:m.kcal,p:m.prot||"?"}))+'</span>';
  h+='</div></summary><div class="mbody">';
  if(m.origin)h+='<p class="origin" style="margin:0">'+esc(m.origin)+'</p>';
  if(tm.knife!=null||tm.fire!=null||tm.total!=null){
    h+='<div class="times"><div><span>'+esc(t("Knife"))+'</span><b>'+(tm.knife??"–")+' min</b></div><div><span>'+esc(t("Heat"))+'</span><b>'+(tm.fire??"–")+' min</b></div><div><span>'+esc(t("Total"))+'</span><b>'+(tm.total??"–")+' min</b></div></div>';
    if(tm.overlap)h+='<p class="small muted" style="margin:0">'+esc(tm.overlap)+'</p>';
  }
  if(m.thaw&&m.thaw.text)h+='<div class="notice warn small"><b>'+esc(t("Frozen"))+'</b>'+esc(m.thaw.text)+(m.thaw.date?" ("+esc(dayName(m.thaw.date))+" "+fmtDate(m.thaw.date)+")":"")+'</div>';
  const ings=m.ingredients||[];
  if(ings.length){h+='<div class="section"><h3>'+esc(t("Ingredients"))+(m.servings?" · "+esc(plural(m.servings,"{n} serving","{n} servings")):"")+'</h3><ul class="ings">';
    ings.forEach((g,i)=>{const ck=m.id+":"+i;const it=g.inv&&invById(g.inv);
      h+='<li><label><input type="checkbox" data-check="'+esc(ck)+'"'+(checks[ck]?" checked":"")+'><span>'+esc(g.text)+(g.inv?'<span class="from">'+esc(tf("from your {p}",{p:it?placeName(it.place).toLowerCase():t("pantry")}))+'</span>':"")+'</span></label></li>'});
    h+='</ul></div>'}
  const steps=m.steps||[];
  if(steps.length){h+='<div class="section"><h3>'+esc(t("Steps"))+'</h3><ol class="steps">'+steps.map(s=>"<li>"+esc(s)+"</li>").join("")+'</ol></div>'}
  (m.notes||[]).forEach(n=>{h+='<div class="section notes"><h3>'+esc(n.title||t("Note"))+'</h3><p>'+esc(n.text)+'</p></div>'});
  if(S.canWrite&&S.db){
    if(!done){
      if(S.donePanel===m.id){
        const linked=ings.map((g,i)=>[g,i]).filter(([g])=>g.inv);
        h+='<div class="panel"><b>'+esc(t("How much did you use of what you had?"))+'</b>';
        if(!linked.length)h+='<p class="small muted" style="margin:0">'+esc(t("This recipe doesn't take anything from the pantry."))+'</p>';
        linked.forEach(([g,i])=>{const it=invById(g.inv);const unit=(it&&it.unit)||g.unit||"";const v=(S.used[m.id]&&S.used[m.id][i]!=null)?S.used[m.id][i]:(g.qty??"");
          h+='<div class="usedrow"><label for="u-'+m.id+'-'+i+'">'+esc(it?it.name:g.text)+(it?'<br><span class="small muted">'+esc(tf("{q} left",{q:fmtQty(it.qty,it.unit)}))+'</span>':"")+'</label><input id="u-'+m.id+'-'+i+'" type="number" inputmode="decimal" min="0" step="any" data-used="'+m.id+'" data-idx="'+i+'" value="'+esc(v)+'"><span class="small">'+esc(unit)+'</span></div>'});
        h+='<p class="small muted" style="margin:0">'+esc(t("Put 0 if you didn't use it after all. It is taken off the pantry."))+'</p><div class="actions"><button class="primary" data-act="confirmDone" data-id="'+m.id+'">'+esc(t("Save as done"))+'</button><button class="ghost" data-act="cancelDone">'+esc(t("Cancel"))+'</button></div></div>';

        h+='</div>';
        if(m.date&&!isPast(m.week))h+='<p class="small muted" style="margin:0">'+esc(t("«Move one day» moves this dish and the next ones of the same meal. «Swap with tomorrow» swaps it with tomorrow's."))+'</p>';
      }
    }else{
      h+='<div class="panel"><b>'+esc(t("How did it turn out?"))+'</b><div class="stars" role="group" aria-label="'+esc(t("Rating"))+'">';
      for(let s=1;s<=5;s++)h+='<button type="button" class="'+((m.rating||0)>=s?"on":"")+'" data-act="rate" data-id="'+m.id+'" data-v="'+s+'" aria-label="'+esc(tf("{n} of 5",{n:s}))+'">★</button>';
      h+='</div><textarea id="c-'+m.id+'" placeholder="'+esc(t("What would you change, what didn't you like, would you make it again…"))+'">'+esc(m.comment||"")+'</textarea>';
      h+='<div class="actions"><button data-act="saveComment" data-id="'+m.id+'">'+esc(t("Save comment"))+'</button><button class="ghost" data-act="undoDone" data-id="'+m.id+'">'+esc(t("I didn't make it"))+'</button></div>';
      if((m.used||[]).length)h+='<p class="small muted" style="margin:0">'+esc(t("Taken off:"))+' '+m.used.map(u=>esc((invById(u.inv)||{name:u.inv}).name)+" "+esc(fmtQty(u.qty,u.unit))).join(" · ")+'</p>';
      h+='</div>';
    }
  }
  h+='</div></details>';return h;
}

function noMenu(){return '<div class="empty">'+esc(t("No menu loaded yet. Ask Claude for it in this week's chat and it will show up here."))+'</div>'}

function viewToday(){
  const today=todayISO();let h='<div class="section">';
  const alerts=S.inv.filter(i=>{const e=expiry(i);return e&&!e.frozen&&(e.cls==="bad"||e.cls==="warn")&&i.qty!==0}).sort((a,b)=>a.expires.localeCompare(b.expires));
  const thaws=liveMeals().filter(m=>m.thaw&&m.thaw.date===today&&m.status!=="done");
  if(thaws.length)h+='<div class="notice warn"><b>'+esc(t("Take out of the freezer today"))+'</b><ul>'+thaws.map(m=>"<li>"+esc(m.thaw.text)+" <span class='small'>"+esc(tf("(for {t})",{t:m.title}))+"</span></li>").join("")+'</ul></div>';
  if(alerts.length)h+='<div class="notice '+(alerts.some(a=>expiry(a).cls==="bad")?"bad":"warn")+'"><b>'+esc(t("Use soon"))+'</b><ul>'+alerts.map(i=>"<li>"+esc(i.name)+" · "+esc(fmtQty(i.qty,i.unit))+" · "+esc(expiry(i).txt.toLowerCase())+"</li>").join("")+'</ul></div>';
  const unknown=S.inv.filter(i=>i.qty==null).length;
  if(unknown)h+='<div class="notice"><span>'+plural(unknown,"There is <b>{n}</b> thing in the pantry without an amount.","There are <b>{n}</b> things in the pantry without an amount.")+' <button class="ghost" data-act="tab" data-tab="pantry" style="min-height:0;padding:2px 8px">'+esc(t("Check them"))+'</button></span></div>';
  h+='</div>';
  if(!S.cfg)return h+noMenu();
  const tm=liveMeals().filter(m=>m.date===today).sort(sortMeals);
  h+='<div class="section"><div class="dayhead today"><h2>'+esc(cap(dayName(today)))+' '+fmtDate(today)+'</h2></div>';
  h+=tm.length?tm.map(m=>mealCard(m)).join(""):'<div class="empty">'+esc(t("Nothing planned today."))+'</div>';
  h+='</div>';
  const tom=addDays(today,1);const nm=liveMeals().filter(m=>m.date===tom).sort(sortMeals);
  if(nm.length)h+='<div class="section"><h3>'+esc(tf("Tomorrow, {d}",{d:dayName(tom)}))+'</h3>'+nm.map(m=>mealCard(m)).join("")+'</div>';
  return h;
}

function viewWeek(){
  if(!S.cfg)return noMenu();
  const sw=selWeek("week");
  const ms=weekMeals(sw).filter(m=>m.slot!=="dessert").sort(sortMeals);const today=todayISO();
  const days=[...new Set(ms.map(m=>m.date))];
  let h=reqView()+weekPick("week");
  if(isPast(sw))h+='<div class="notice small"><span>'+esc(t("Past week, for reference."))+' <button class="ghost" data-act="stepWeek" data-view="week" data-week="'+esc(S.cfg.week)+'" style="min-height:0;padding:2px 8px">'+esc(t("Back to this week"))+'</button></span></div>';
  const sum=(S.cfg.summaries&&S.cfg.summaries[sw])||(sw===S.cfg.week?S.cfg.summary:"");
  if(sum)h+='<div class="notice small">'+esc(sum)+'</div>';
  days.forEach(d=>{h+='<div class="daygroup"><div class="dayhead'+(d===today?" today":"")+'"><h2>'+esc(cap(dayName(d)))+'</h2><span class="muted small">'+fmtDate(d)+(d===today?" · "+esc(t("today")):"")+'</span></div>'+ms.filter(m=>m.date===d).map(m=>mealCard(m)).join("")+'</div>'});
  const ps=weekMeals(sw).filter(m=>m.slot==="dessert").sort(sortMeals);
  if(ps.length)h+='<div class="daygroup"><div class="dayhead"><h2>'+esc(t("Desserts"))+'</h2></div>'+ps.map(m=>mealCard(m)).join("")+'</div>';
  return (ms.length||ps.length)?h:h+noMenu();
}

/* Free and reserved: how much of each pantry item already belongs to a pending dish.
   Comes from ingredients with inv (what the dish takes from home) and from shopping lines with key and uses
   (what was bought for a dish and is now in the pantry). Allocated first to whatever expires first. */
let RES={};
function reservations(){
  const ws=weeks();const cur=(S.cfg&&S.cfg.week)||"";const res={};
  const add=(id,q,m)=>{if(!(q>0))return;const r=res[id]=res[id]||{q:0,meals:[]};r.q+=q;const f=r.meals.find(x=>x.m===m);if(f)f.q+=q;else r.meals.push({m,q})};
  const pend=S.meals.filter(m=>m.status!=="done"&&(ws.includes(m.week)||m.week>cur));
  const direct={};
  pend.forEach(m=>(m.ingredients||[]).forEach(g=>{if(!g.inv||!(g.qty>0)||!invById(g.inv))return;add(g.inv,g.qty,m);(direct[m.id]=direct[m.id]||new Set()).add(g.inv)}));
  const byKey={};
  S.shop.filter(s=>s.key&&Array.isArray(s.uses)).forEach(s=>{const k=s.week+"|"+s.key;(byKey[k]=byKey[k]||[]).push(s)});
  Object.values(byKey).forEach(ls=>{
    const k=ls[0].key;const unit=(ls.find(s=>s.unit)||{}).unit||"pc";const per=(ls.find(s=>s.per)||{}).per||null;
    const match=[...new Set(ls.flatMap(s=>s.match||[]))];const excl=[...new Set(ls.flatMap(s=>s.excl||[]))];
    const docs=S.inv.filter(i=>i.qty>0&&(i.id===k||(match.some(x=>hasWord(i.name,x))&&!excl.some(x=>hasWord(i.name,x))))).sort((a,b)=>(a.expires||"9999").localeCompare(b.expires||"9999"));
    if(!docs.length)return;
    ls.forEach(s=>s.uses.forEach(u=>{
      const m=pend.find(x=>x.id===u.m);if(!m)return;
      if(docs.some(d=>direct[m.id]&&direct[m.id].has(d.id)))return; /* already counted through its ingredient */
      let left=u.q||0;
      for(const d of docs){if(left<=0)break;
        const capU=toUnit(d.qty,d.unit,unit,per);if(capU==null)continue;
        const usedU=res[d.id]?(toUnit(res[d.id].q,d.unit,unit,per)||0):0;
        const take=Math.min(Math.max(0,capU-usedU),left);
        if(take>0){add(d.id,toUnit(take,unit,d.unit,per),m);left-=take}}
    }));
  });
  return res;
}
function mealTag(m){if(!m.date)return t("Dessert")+" · "+(m.short||m.title);return SHORT_DAYS[weekday(m.date)]+" "+Number(m.date.slice(8))+" "+slotName(m.slot)+" · "+(m.short||m.title)}
function resInfo(i){
  const r=RES[i.id];if(!r||i.qty==null)return null;
  const free=Math.round((i.qty-r.q)*100)/100;
  const chip=free<0?'<span class="chip bad">'+esc(tf("Short ~{q} for the dishes",{q:fmtQty(-free,i.unit)}))+'</span>':(free===0?'<span class="chip warn">'+esc(t("All reserved"))+'</span>':'<span class="chip ok">'+esc(tf("Free {f} · reserved {r}",{f:fmtQty(free,i.unit),r:fmtQty(r.q,i.unit)}))+'</span>');
  const list='<div><h3>'+esc(t("Reserved for"))+'</h3><ul class="moves">'+r.meals.slice().sort((a,b)=>sortMeals(a.m,b.m)).map(x=>"<li>"+esc(mealTag(x.m))+" · "+esc(fmtQty(x.q,i.unit))+"</li>").join("")+'</ul></div>';
  return{chip,list,free};
}

/* Live shopping list: recalculated from what is in the Pantry.
   Only lines with key + uses (the ones loaded with the week's menu) take part. Fields of each line:
   key (inventory id or short name), match (words to find it by name), excl (words that rule it out),
   unit (g, ml, pc, can), per (g per piece, to go from pc to g), uses ([{m: dish id, q: amount}]). */
function normTxt(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function hasWord(name,term){const x=normTxt(term).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return new RegExp("(^|[^a-z])"+x).test(normTxt(name))}
const PIECES=["pc","can","jar","pack"];
function toUnit(q,from,to,per){
  if(q==null)return null;from=from||"pc";if(from===to)return q;
  if(PIECES.includes(from)&&PIECES.includes(to))return q;
  if(per){if(from==="g"&&PIECES.includes(to))return q/per;if(PIECES.includes(from)&&to==="g")return q*per}
  return null}
function roundQ(q,u){if(PIECES.includes(u))return Math.ceil(q-0.01);if(q>=100)return Math.round(q/10)*10;return Math.max(5,Math.round(q/5)*5)}
function shopCalc(wk){
  const lines=S.shop.filter(s=>s.week===wk&&s.key&&Array.isArray(s.uses));
  if(!lines.length)return null;
  const ws=weeks();const byKey={};
  lines.forEach(s=>{(byKey[s.key]=byKey[s.key]||[]).push(s)});
  const earlier=S.meals.filter(m=>m.status!=="done"&&ws.includes(m.week)&&m.week<wk);
  const keys={};
  Object.entries(byKey).forEach(([k,ls])=>{
    const unit=(ls.find(s=>s.unit)||{}).unit||"pc";const per=(ls.find(s=>s.per)||{}).per||null;
    const match=[...new Set(ls.flatMap(s=>s.match||[]))];const excl=[...new Set(ls.flatMap(s=>s.excl||[]))];
    const docs=S.inv.filter(i=>i.id===k||(match.some(x=>hasWord(i.name,x))&&!excl.some(x=>hasWord(i.name,x))));
    let stock=0;const got=[],odd=[],unknown=[];
    docs.forEach(i=>{if(i.qty==null){unknown.push(i);return}const q=toUnit(i.qty,i.unit,unit,per);if(q==null){if(i.qty>0)odd.push(i);return}stock+=q;got.push(i)});
    const ids=got.map(i=>i.id);
    let other=0;const otherMeals=[];
    earlier.forEach(m=>(m.ingredients||[]).forEach(g=>{if(!g.inv||!ids.includes(g.inv))return;const it=invById(g.inv);const q=toUnit(g.qty,it&&it.unit,unit,per);if(q>0){other+=q;if(!otherMeals.includes(m))otherMeals.push(m)}}));
    let dem=0;
    ls.forEach(s=>s.uses.forEach(u=>{const m=S.meals.find(x=>x.id===u.m);if(!m||m.status==="done")return;dem+=u.q||0}));
    const avail=stock-other;
    keys[k]={unit,stock,other,avail,dem,short:Math.max(0,dem-Math.max(0,avail)),got:got.filter(i=>i.qty>0),odd,unknown,otherMeals,lines:ls};
  });
  const past=S.meals.filter(m=>m.status!=="done"&&ws.includes(m.week)&&m.week<=wk&&m.date&&m.date<todayISO()&&(m.ingredients||[]).some(g=>g.inv)).sort(sortMeals);
  return{keys,past};
}
function haveTxt(st){return st.got.map(i=>esc(i.name)+" "+esc(fmtQty(i.qty,i.unit))+" ("+esc(placeName(i.place))+")").join(", ")}
function shopLi(s,extra){
  return '<li><label><input type="checkbox" data-shop="'+s.id+'"'+(s.checked?" checked":"")+(S.canWrite&&S.db?"":" disabled")+'><span>'+esc(s.text)+(s.store?' <span class="chip warn">'+esc(s.store)+'</span>':"")+(s.dest?' <span class="small muted">→ '+esc(s.dest)+'</span>':"")+(extra||"")+'</span></label></li>'}
function viewShopping(){
  if(!S.cfg)return noMenu();
  const csw=selWeek("shopping");const items=S.shop.filter(s=>s.week===csw);
  const calc=shopCalc(csw);
  const buy=[],covered=[],have=[];
  items.forEach(s=>{
    const st=calc&&s.key&&calc.keys[s.key];
    if(!st){(s.kind==="have"?have:buy).push({s});return}
    const hasBuy=st.lines.some(l=>l.kind!=="have");
    if(s.kind!=="have"){
      if(st.short<=0&&st.dem>0&&!s.checked)covered.push({s,st});
      else if(st.dem<=0&&!s.checked&&s.uses.length)covered.push({s,st,gone:true});
      else buy.push({s,st});
    }else if(st.short>0&&!hasBuy)buy.push({s,st,short:true});
    else have.push({s,st});
  });
  const done=buy.filter(x=>x.s.checked).length;
  let h=weekSwitch("shopping")+'<div class="row" style="justify-content:space-between"><span class="counter num">'+esc(tf("{n} of {t} in the cart",{n:done,t:buy.length}))+'</span>';
  if(S.canWrite&&S.db&&done)h+='<button class="ghost" data-act="uncheckAll">'+esc(t("Untick all"))+'</button>';
  h+='</div>';
  if(calc){
    h+='<p class="small muted" style="margin:0">'+esc(t("The list adjusts itself to what you note in Pantry: if you already have it, it leaves the list; if you run short of something you had, it comes in."))+(covered.length?esc(plural(covered.length," Right now you already have {n} thing."," Right now you already have {n} things.")):'')+'</p>';
    if(calc.past.length){const names=calc.past.slice(0,4).map(m=>esc(m.short||m.title)+" ("+esc(dayName(m.date))+" "+Number(m.date.slice(8))+")");
      h+='<div class="notice warn small"><b>'+esc(plural(calc.past.length,"{n} dish from past days is still not marked as done","{n} dishes from past days are still not marked as done"))+'</b><span>'+names.join(", ")+(calc.past.length>4?esc(tf(" and {n} more",{n:calc.past.length-4})):'')+esc(t(". The list assumes you will still use their ingredients. Mark them as done (put 0 for anything you didn't use) and the list adjusts."))+'</span></div>'}
  }
  if(S.canWrite&&S.db)h+='<div class="row"><input id="add-shop" type="text" placeholder="'+esc(t("Add to the shopping"))+'" style="flex:1;min-width:0"><button data-act="addShop">'+esc(t("Add"))+'</button></div>';
  if(!buy.length)h+='<div class="empty">'+esc(t("Nothing to buy this week."))+'</div>';
  const secOf=x=>x.short?t("You're short of what you had"):(x.s.section||"—");
  const secs=[...new Set(buy.map(secOf))];
  secs.forEach(sec=>{h+='<div class="shopsec"><h3>'+esc(sec)+'</h3><ul class="ings">'+buy.filter(x=>secOf(x)===sec).sort((a,b)=>(a.s.order||0)-(b.s.order||0)).map(x=>{
    const s=x.s,st=x.st;let extra="";
    if(st){
      const u=st.unit;
      if(x.short)extra='<span class="small muted">'+esc(t(" · not enough at home"))+(st.otherMeals.length?esc(t(" (what you have is used by earlier dishes)")):'')+esc(tf(": buy ~{q}",{q:fmtQty(roundQ(st.short,u),u)}))+'</span>';
      else if(st.avail>0&&st.short>0)extra='<span class="small muted">'+esc(tf(" · you have ~{h}, ~{s} short",{h:fmtQty(roundQ(st.avail,u),u),s:fmtQty(roundQ(st.short,u),u)}))+'</span>';
      if(st.odd.length)extra+='<span class="small muted">'+esc(tf(" · at home there is {x}: check if it's enough",{x:st.odd.map(i=>'«'+i.name+'» ('+fmtQty(i.qty,i.unit)+')').join(", ")}))+'</span>';
      if(st.unknown.length)extra+='<span class="small muted">'+esc(tf(" · {x} without amount in Pantry",{x:st.unknown.map(i=>'«'+i.name+'»').join(", ")}))+'</span>';
    }
    return shopLi(s,extra)}).join("")+'</ul></div>'});
  if(covered.length)h+='<div class="shopsec"><h3>'+esc(t("Already at home · don't buy it"))+'</h3><ul class="ings">'+covered.map(x=>'<li style="padding:4px 0"><span class="chip ok">'+esc(t(x.gone?"No longer needed":"You have it"))+'</span> <span class="muted">'+esc(x.s.text)+'</span>'+(x.gone?' <span class="small muted">'+esc(t("· the dishes that used it are done"))+'</span>':(x.st.got.length?' <span class="small muted">· '+haveTxt(x.st)+'</span>':""))+'</li>').join("")+'</ul></div>';
  if(have.length)h+='<div class="shopsec"><h3>'+esc(t("Already have · where it goes"))+'</h3><ul class="ings">'+have.map(x=>'<li style="padding:4px 0">'+esc(x.s.text)+(x.s.dest?' <span class="small muted">→ '+esc(x.s.dest)+'</span>':"")+'</li>').join("")+'</ul></div>';
  return h;
}

function nextMonday(){const td=todayISO();const wd=weekday(td);return addDays(td,((8-wd)%7)||7)}
function weekLoaded(wk){return weeks().includes(wk)||S.meals.some(m=>m.week===wk)}
function targetWeek(){let wk=nextMonday();if(weekLoaded(wk))wk=addDays(wk,7);return wk}
function fmtTime(iso){const d=new Date(iso);if(!iso||isNaN(d))return"";try{return d.toLocaleString(LOCALE,{weekday:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
/* Ask for the menu: leaves requests/menu-<monday> in the database; a Claude scheduled task picks it up every hour */
function reqView(){
  if(!S.db)return"";
  const wk=targetWeek();const r=(S.reqs||[]).find(x=>x.id==="menu-"+wk);
  const ST={pending:["warn","Ordered"],working:["warn","Being made"],done:["ok","Ready"],error:["bad","Error"]};
  const st=r&&ST[r.status];
  let h='<details class="inv" data-key="req"'+(open.has("req")?" open":"")+'><summary><span class="iname">'+esc(tf("Ask Claude for the menu for the week of {d}",{d:fmtDate(wk)}))+'</span><span class="iqty">'+(st?'<span class="chip '+st[0]+'">'+esc(t(st[1]))+'</span>':"+")+'</span></summary><div class="iedit">';
  if(r){
    if(r.status==="pending")h+='<p class="small" style="margin:0">'+esc(tf("Ordered on {t}. Claude checks orders every hour: within an hour you will have the menu here (and an email, if you set up reminders).",{t:fmtTime(r.requestedAt)}))+'</p>';
    else if(r.status==="working")h+='<p class="small" style="margin:0">'+esc(t("Claude is making it"))+(r.startedAt?esc(tf(" since {t}",{t:fmtTime(r.startedAt)})):"")+'.</p>';
    else if(r.status==="done")h+='<p class="small" style="margin:0">'+esc(t("Ready: it's on the board. Check it and tell Claude in the chat if it looks good."))+'</p>';
    else if(r.status==="error")h+='<p class="small" style="margin:0">'+esc(t("It couldn't be made"))+(r.error?": "+esc(r.error):"")+'.</p>';
    if(r.notes)h+='<p class="small muted" style="margin:0">'+esc(tf("Your notes: {x}",{x:r.notes}))+'</p>';
    if(S.canWrite&&(r.status==="pending"||r.status==="error"))h+='<div class="actions"><button class="ghost danger" data-act="reqCancel" data-id="menu-'+wk+'">'+esc(t(r.status==="error"?"Delete it to order again":"Cancel the order"))+'</button></div>';
  }else if(S.canWrite){
    h+='<p class="small muted" style="margin:0">'+esc(COVERAGE)+esc(t(". Claude looks at the pantry and your notes, loads it here and doesn't save it anywhere else until you say yes."))+'</p>';
    h+='<div class="field"><label for="req-notes">'+esc(t("Notes for Claude"))+'</label><textarea id="req-notes" placeholder="'+esc(t("Days you eat out, leftovers, anything you fancy or don't…"))+'"></textarea></div>';
    h+='<label class="row small" style="gap:8px;cursor:pointer"><input type="checkbox" id="req-desserts" checked style="width:20px;height:20px;min-height:0;accent-color:var(--accent)"> '+esc(t("With desserts"))+'</label>';
    h+='<div class="actions"><button class="primary" data-act="reqMenu" data-id="menu-'+wk+'" data-week="'+wk+'">'+esc(t("Ask for the menu"))+'</button></div>';
  }
  return h+'</div></details>';
}

function viewSummary(){
  if(!S.cfg)return noMenu();
  const sw=selWeek("summary");const today=todayISO();
  const ms=weekMeals(sw).filter(m=>m.slot!=="dessert"&&m.date).sort(sortMeals);
  const ps=weekMeals(sw).filter(m=>m.slot==="dessert").sort(sortMeals);
  let h='<div class="rs">'+weekPick("summary");
  if(!ms.length)return h+noMenu()+'</div>';
  h+='<div class="rs-list">';let prev=null;
  ms.forEach(m=>{const same=m.date===prev;prev=m.date;const tm=m.times||{};
    const who=m.servings==1&&m.for?cap(m.for):"";
    h+='<button type="button" class="rs-row p-'+esc(m.protein||"other")+(same?" same":"")+(m.status==="done"?" done":"")+(m.date===today?" today":"")+'" data-act="openMeal" data-id="'+esc(m.id)+'">'
      +'<span class="rs-day"><b>'+SHORT_DAYS[weekday(m.date)]+'</b><span>'+esc(slotName(m.slot))+'</span></span>'
      +'<span class="rs-dish">'+esc(m.short||m.title)+(m.badge?'<span class="rs-tag">'+esc(m.badge)+'</span>':"")+(who?'<small>'+esc(who)+'</small>':"")+'</span>'
      +'<span class="rs-n"><b>'+(m.kcal||"–")+'</b><span>'+(m.prot!=null?m.prot+" g":"")+'</span></span>'
      +'<span class="rs-n"><b>'+(tm.knife!=null?tm.knife+"′":"–")+'</b><span>'+(tm.total!=null?esc(tf("{n}′ total",{n:tm.total})):"")+'</span></span></button>'});
  h+='</div>';
  if(ps.length){h+='<div class="rs-postres">'+ps.slice(0,2).map(m=>'<button type="button" class="rs-postre" data-act="openMeal" data-id="'+esc(m.id)+'"><span class="cap">'+esc(t("Dessert"))+(m.badge?" "+esc(m.badge.toLowerCase()):"")+'</span><b>'+esc(m.short||m.title)+'</b><span class="sub">'+(m.yield?esc(m.yield)+" · ":"")+(m.kcal?m.kcal+" kcal":"")+'</span></button>').join("")+'</div>'}
  const sum=(S.cfg.summaries&&S.cfg.summaries[sw])||(sw===S.cfg.week?S.cfg.summary:"");
  h+='<div class="rs-foot">'+(sum?'<span>'+esc(sum)+'</span>':"")+'<span class="rs-legend"><span class="p-meat"><i></i>'+esc(t("Meat"))+'</span><span class="p-fish"><i></i>'+esc(t("Fish and seafood"))+'</span><span class="p-egg"><i></i>'+esc(t("Egg"))+'</span><span class="p-legume"><i></i>'+esc(t("Pulses"))+'</span><span>'+esc(t("kcal and g per serving · ′ = knife minutes"))+'</span></span></div>';
  return h+'</div>';
}

function viewNotes(){
  const rated=S.meals.filter(m=>m.status==="done").sort((a,b)=>(b.doneAt||"").localeCompare(a.doneAt||""));
  if(!rated.length)return '<div class="empty">'+esc(t("When you mark dishes as done and rate them, they show up here. Claude reads them before repeating recipes."))+'</div>';
  const wks=[...new Set(rated.map(m=>m.week))];let h="";
  wks.forEach(wk=>{h+='<div class="section"><h3>'+esc(tf("Week of {d}",{d:fmtDate(wk)}))+'</h3>';
    rated.filter(m=>m.week===wk).forEach(m=>{h+='<div class="notice"><div class="row" style="justify-content:space-between"><b>'+esc(m.title)+'</b><span style="color:var(--star)" aria-label="'+esc(tf("{n} of 5",{n:m.rating||0}))+'">'+(m.rating?"★".repeat(m.rating):'<span class="small muted">'+esc(t("no rating"))+'</span>')+'</span></div>'+(m.comment?'<span class="small">'+esc(m.comment)+'</span>':"")+'</div>'});
    h+='</div>'});
  return h;
}

/* Update stamps: menu = config/current.updatedAt; pantry = the newest updatedAt in inventory */
function fmtStamp(iso){
  const d=new Date(iso);if(!iso||isNaN(d))return null;
  try{return d.toLocaleString(LOCALE,{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return d.toISOString().slice(0,16).replace("T"," ")}
}
function updLine(){
  if(S.state!=="ready")return "";
  const parts=[];
  const m=S.cfg&&S.cfg.updatedAt?fmtStamp(S.cfg.updatedAt):null;
  parts.push('<span>'+esc(t("Menu updated:"))+' <b>'+esc(m||t("no date"))+'</b></span>');
  let last=null;
  S.inv.forEach(i=>{if(i.updatedAt&&(!last||i.updatedAt>last))last=i.updatedAt});
  const iv=last?fmtStamp(last):null;
  const age=last?(Date.now()-new Date(last).getTime())/864e5:null;
  parts.push('<span>'+esc(t("Pantry updated:"))+' <b>'+esc(iv||t("no date"))+'</b>'+(age!==null&&age>7?' <span class="stale">'+esc(t("· over a week ago"))+'</span>':"")+'</span>');
  return parts.join("");
}
function render(){
  pending=false;
  document.body.classList.toggle("fit",S.tab==="summary"&&S.state==="ready"&&!!S.cfg);
  const tabs=document.getElementById("tabs");
  const warnCount=S.inv.filter(i=>{const e=expiry(i);return e&&e.cls==="bad"&&i.qty!==0}).length;
  tabs.innerHTML=TABS.map(([k,l])=>'<button type="button" data-act="tab" data-tab="'+k+'"'+(S.tab===k?' aria-current="page"':"")+'>'+esc(t(l))+(k==="pantry"&&warnCount?'<span class="badge">'+warnCount+'</span>':"")+'</button>').join("");
  document.getElementById("wk").textContent=S.cfg?(S.cfg.label||tf("Week of {d}",{d:fmtDate(S.cfg.week)}))+(S.cfg.version?" · "+S.cfg.version:""):"";
  document.getElementById("upd").innerHTML=updLine();
  const v=document.getElementById("view");
  if(S.state==="loading"){v.innerHTML='<div class="empty">'+esc(t("Loading the board…"))+'</div>';return}
  if(S.state==="offline"){v.innerHTML='<div class="empty">'+esc(t("The data can't be loaded. Open this link with your Claude account signed in."))+'</div>';return}
  let h=S.canWrite?"":'<div class="notice small">'+esc(t("You can see it but not change it. Ask whoever made it to invite you as an editor."))+'</div>';
  h+={today:viewToday,summary:viewSummary,week:viewWeek,pantry:viewPantry,shopping:viewShopping,notes:viewNotes}[S.tab]();
  v.innerHTML='<div class="section" style="gap:14px">'+h+'</div>';
}

/* ---------- ACTIONS ---------- */
const now=()=>new Date().toISOString();
async function adjustInv(id,delta,why){
  const it=invById(id);if(!it||it.qty==null)return;
  const q=Math.max(0,Math.round((it.qty+delta)*100)/100);
  const moves=(it.moves||[]).concat([{at:now(),delta,why}]).slice(-15);
  it.qty=q;it.moves=moves; // optimistic, for the next iteration
  await S.db.doc("inventory/"+id).update({qty:q,moves,updatedAt:now()});
}
async function confirmDone(id){
  const m=S.meals.find(x=>x.id===id);if(!m)return;
  const used=[];const agg={};
  (m.ingredients||[]).forEach((g,i)=>{if(!g.inv)return;const raw=S.used[id]&&S.used[id][i]!=null?S.used[id][i]:g.qty;const v=parseFloat(String(raw).replace(",","."));if(!(v>0))return;agg[g.inv]=(agg[g.inv]||0)+v});
  Object.entries(agg).forEach(([inv,qty])=>{const it=invById(inv);used.push({inv,qty,unit:it?it.unit:""})});
  const ok=await w(async()=>{for(const u of used)await adjustInv(u.inv,-u.qty,(LANG==="es"?"Hecha: ":"Done: ")+m.title);await S.db.doc("meals/"+id).update({status:"done",doneAt:now(),used})});
  if(ok){S.donePanel=null;delete S.used[id];toast(t(used.length?"Done. Taken off the pantry.":"Marked as done."))}
}
async function undoDone(id){
  const m=S.meals.find(x=>x.id===id);if(!m)return;
  await w(async()=>{for(const u of (m.used||[]))await adjustInv(u.inv,u.qty,(LANG==="es"?"Deshecha: ":"Undone: ")+m.title);await S.db.doc("meals/"+id).update({status:"pending",doneAt:null,used:[]})});
}
async function push(id){
  const m=S.meals.find(x=>x.id===id);if(!m||!m.date)return;
  const list=weekMeals(m.week).filter(x=>x.slot===m.slot&&x.status!=="done"&&x.date&&x.date>=m.date).sort((a,b)=>b.date.localeCompare(a.date));
  const prev=list.map(x=>({id:x.id,date:x.date,movedFrom:x.movedFrom||null}));
  const ok=await w(async()=>{for(const x of list)await S.db.doc("meals/"+x.id).update({date:addDays(x.date,1),movedFrom:x.movedFrom||x.date})});
  if(ok)toast(list.length===1?t("Moved to tomorrow."):tf("Moved {n} dishes one day.",{n:list.length}),async()=>{await w(async()=>{for(const p of prev.slice().reverse())await S.db.doc("meals/"+p.id).update({date:p.date,movedFrom:p.movedFrom})});toast(t("Undone."))});
}
async function swap(id){
  const m=S.meals.find(x=>x.id===id);if(!m||!m.date)return;const tom=addDays(m.date,1);
  const n=weekMeals(m.week).find(x=>x.slot===m.slot&&x.date===tom&&x.status!=="done");
  const prev=[{id:m.id,date:m.date,movedFrom:m.movedFrom||null}].concat(n?[{id:n.id,date:n.date,movedFrom:n.movedFrom||null}]:[]);
  const ok=await w(async()=>{await S.db.doc("meals/"+m.id).update({date:tom,movedFrom:m.movedFrom||m.date});if(n)await S.db.doc("meals/"+n.id).update({date:m.date,movedFrom:n.movedFrom||n.date})});
  if(ok)toast(n?tf("Swapped with «{t}».",{t:n.title}):t("Moved to tomorrow."),async()=>{await w(async()=>{for(const p of prev)await S.db.doc("meals/"+p.id).update({date:p.date,movedFrom:p.movedFrom})});toast(t("Undone."))});
}
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"item"}

document.addEventListener("toggle",e=>{const d=e.target;if(!(d instanceof HTMLDetailsElement)||!d.dataset.key)return;if(d.open)open.add(d.dataset.key);else open.delete(d.dataset.key);persist()},true);
document.addEventListener("input",e=>{const x=e.target;if(x.dataset&&x.dataset.used){(S.used[x.dataset.used]=S.used[x.dataset.used]||{})[x.dataset.idx]=x.value}});
document.addEventListener("change",async e=>{const x=e.target;
  if(x.dataset&&x.dataset.check){checks[x.dataset.check]=x.checked;if(!x.checked)delete checks[x.dataset.check];persist()}
  if(x.dataset&&x.dataset.weekpick){S.sel[x.dataset.weekpick]=x.value;render();window.scrollTo(0,0);return}
  if(x.dataset&&x.dataset.shop){const id=x.dataset.shop;const ok=await w(()=>S.db.doc("shopping/"+id).update({checked:x.checked}));if(!ok)x.checked=!x.checked}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="tab"){S.tab=b.dataset.tab;persist();try{history.replaceState(null,"","#"+S.tab)}catch(_){}render();window.scrollTo(0,0);return}
  if(a==="selWeek"){S.sel[b.dataset.view]=b.dataset.week;render();return}
  if(a==="stepWeek"){if(!b.dataset.week)return;S.sel[b.dataset.view]=b.dataset.week;render();window.scrollTo(0,0);return}
  if(a==="openMeal"){const m=S.meals.find(x=>x.id===id);if(!m)return;S.tab="week";S.sel.week=m.week;open.add("m:"+id);persist();try{history.replaceState(null,"","#week")}catch(_){}render();const el=document.querySelector('[data-key="m:'+id+'"]');if(el)el.scrollIntoView({block:"start"});return}
  if(S.busy)return;
  if(a==="reqMenu"){const wk=b.dataset.week;const nt=document.getElementById("req-notes");const pc=document.getElementById("req-desserts");
    if(await w(()=>S.db.doc("requests/"+id).set({type:"menu",week:wk,status:"pending",coverage:COVERAGE,desserts:!!(pc&&pc.checked),notes:(nt?nt.value:"").trim(),requestedAt:now()}))){open.add("req");persist();toast(t("Ordered. You'll have it here within an hour."))}return}
  if(a==="reqCancel"){if(await w(()=>S.db.doc("requests/"+id).delete()))toast(t("Order cancelled."));return}
  if(a==="openDone"){S.donePanel=id;render();return}
  if(a==="cancelDone"){S.donePanel=null;render();return}
  if(a==="confirmDone"){b.disabled=true;await confirmDone(id);return}
  if(a==="undoDone"){await undoDone(id);return}
  if(a==="push"){b.disabled=true;await push(id);return}
  if(a==="swap"){b.disabled=true;await swap(id);return}
  if(a==="rate"){const v=+b.dataset.v;const m=S.meals.find(x=>x.id===id);await w(()=>S.db.doc("meals/"+id).update({rating:m&&m.rating===v?0:v,ratedAt:now()}));return}
  if(a==="saveComment"){const txt=document.getElementById("c-"+id).value.trim();if(await w(()=>S.db.doc("meals/"+id).update({comment:txt,ratedAt:now()})))toast(t("Comment saved."));return}
  if(a==="saveInv"){const it=invById(id);if(!it)return;const qv=document.getElementById("q-"+id).value.trim();const q=qv===""?null:parseFloat(qv.replace(",","."));
    const nm=document.getElementById("nm-"+id).value.trim();
    const data={name:nm||it.name,qty:q,expires:document.getElementById("x-"+id).value||null,opened:document.getElementById("o-"+id).value||null,place:document.getElementById("p-"+id).value,note:document.getElementById("n-"+id).value.trim(),updatedAt:now()};
    if(q!==it.qty&&q!=null)data.moves=(it.moves||[]).concat([{at:now(),delta:Math.round((q-(it.qty||0))*100)/100,why:LANG==="es"?"Ajuste a mano":"Changed by hand"}]).slice(-15);
    if(await w(()=>S.db.doc("inventory/"+id).update(data))){open.delete("i:"+id);persist();toast(t("Saved."))}return}
  if(a==="emptyInv"){const it=invById(id);if(await w(()=>S.db.doc("inventory/"+id).update({qty:0,updatedAt:now(),moves:(it.moves||[]).concat([{at:now(),delta:-(it.qty||0),why:t("Used up")}]).slice(-15)})))toast(t("Marked as used up."));return}
  if(a==="dupInv"){const it=invById(id);if(!it)return;const nid=slug(it.name)+"-"+Date.now().toString(36).slice(-5);
    const data={name:it.name,qty:null,unit:it.unit||"pc",place:it.place||"pantry",expires:null,opened:null,note:"",moves:[],updatedAt:now()};
    if(await w(()=>S.db.doc("inventory/"+nid).set(data))){open.delete("i:"+id);open.add("i:"+nid);open.add("pl:"+(it.place||"pantry"));persist();toast(t("Copy added below: add brand, amount and date."))}return}
  if(a==="clrDate"){const f=b.dataset.field;if(f!=="expires"&&f!=="opened")return;
    const inp=document.getElementById((f==="expires"?"x-":"o-")+id);if(inp)inp.value="";
    if(await w(()=>S.db.doc("inventory/"+id).update({[f]:null,updatedAt:now()})))toast(t(f==="expires"?"Expiry date removed.":"Opening date removed."));return}
  if(a==="askDel"){S.confirmDel=id;render();return}
  if(a==="cancelDel"){S.confirmDel=null;render();return}
  if(a==="delInv"){S.confirmDel=null;if(await w(()=>S.db.doc("inventory/"+id).delete()))toast(t("Removed."));return}
  if(a==="addInv"){const name=document.getElementById("ai-name").value.trim();if(!name){toast(t("Say what it is."));return}
    const qv=document.getElementById("ai-qty").value.trim();let nid=slug(name);if(invById(nid))nid+="-"+Date.now().toString(36).slice(-4);
    const data={name,qty:qv===""?null:parseFloat(qv.replace(",",".")),unit:document.getElementById("ai-unit").value,place:document.getElementById("ai-place").value,expires:document.getElementById("ai-exp").value||null,opened:null,note:"",moves:[],updatedAt:now()};
    if(await w(()=>S.db.doc("inventory/"+nid).set(data))){open.delete("add-inv");persist();toast(t("Added."))}return}
  if(a==="addShop"){const inp=document.getElementById("add-shop");const txt=inp.value.trim();if(!txt)return;
    if(await w(()=>S.db.collection("shopping").doc().set({week:selWeek("shopping"),text:txt,section:t("Added by hand"),kind:"buy",checked:false,order:Date.now()}))){inp.value="";toast(t("Added to the shopping."))}return}
  if(a==="uncheckAll"){const list=S.shop.filter(s=>s.week===selWeek("shopping")&&s.checked);await w(async()=>{for(const s of list)await S.db.doc("shopping/"+s.id).update({checked:false})});return}
});

/* ---------- START ---------- */
render();
(async()=>{
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){S.state="offline";render();return}
  S.db=db;const got={cfg:0,meals:0,inv:0,shop:0};
  const ready=k=>{got[k]=1;if(got.cfg&&got.meals&&got.inv&&got.shop)S.state="ready";schedule()};
  db.doc("config/current").onSnapshot(s=>{S.cfg=s.exists?s.data():null;ready("cfg")},()=>ready("cfg"));
  db.collection("meals").onSnapshot(s=>{S.meals=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready("meals")},()=>ready("meals"));
  db.collection("inventory").onSnapshot(s=>{S.inv=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready("inv")},()=>ready("inv"));
  db.collection("shopping").onSnapshot(s=>{S.shop=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready("shop")},()=>ready("shop"));
  db.collection("requests").onSnapshot(s=>{S.reqs=s.docs.map(d=>Object.assign({id:d.id},d.data()));schedule()},()=>{});
  try{const u=await window.claude.use("user");if(u){const c=await u.can("data.write");if(c===false){S.canWrite=false;schedule()}else if(c===true)S.writeChecked=true}}catch(e){}
})();
})();
</script>
